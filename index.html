<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Wedding Message Booth</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #000; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; touch-action: none; }

        /* カメラ映像の表示コンテナ (タブを避けた中央配置) */
        #camera-video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100dvw; height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            background-color: #000;
        }
        #camera-video {
            /* 9:16の比率を保ちつつ、タブバーに被らない最大サイズに調整 */
            max-width: 100%;
            max-height: 75dvh; 
            aspect-ratio: 9 / 16;
            object-fit: cover;
            border-radius: 10px;
        }

        @media screen and (orientation: landscape) {
            #camera-video {
                aspect-ratio: 16 / 9;
                max-height: 100%;
                max-width: 75dvw;
            }
        }

        /* UIレイヤー */
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100dvw; height: 100dvh;
            z-index: 10;
            pointer-events: none;
        }

        /* 1. 事前確認画面 */
        #check-ui {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        #check-screen {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #check-screen h2 { color: #333; font-size: 24px; margin-bottom: 15px; }
        #check-screen p { color: #333; font-size: 15px; margin-bottom: 20px; line-height: 1.6; font-weight: bold; }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            text-align: left;
            gap: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            cursor: pointer;
        }
        .checkbox-label input { width: 22px; height: 22px; flex-shrink: 0; }

        #next-btn {
            background-color: #ccc; color: white;
            border: none; padding: 15px 40px; font-size: 18px; font-weight: bold;
            border-radius: 30px; cursor: not-allowed; transition: 0.3s;
        }
        #next-btn.active {
            background-color: #ef5350; cursor: pointer;
            box-shadow: 0 5px 15px rgba(239, 83, 80, 0.4);
        }

        /* 横向きUIの回転処理 */
        @media screen and (orientation: portrait) {
            .rotate-ui {
                transform: rotate(-90deg);
                width: 100dvh;
                height: 100dvw;
                position: absolute;
                top: 50%; left: 50%;
                margin-top: -50dvw; margin-left: -50dvh;
            }
        }
        @media screen and (orientation: landscape) {
            .rotate-ui {
                width: 100dvw; height: 100dvh;
                position: absolute; top: 0; left: 0;
            }
        }

        .ui-content {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; height: 100%; pointer-events: auto; position: relative;
        }

        /* 2. 待機画面 */
        #ready-ui { display: none; }
        #ready-screen {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px; padding: 30px; text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        #ready-screen h2 { color: #d4af37; font-size: 28px; margin-bottom: 15px; font-family: serif; }
        #ready-screen p { color: #333; font-size: 16px; margin-bottom: 25px; line-height: 1.5; font-weight: bold; }

        #start-btn {
            background-color: #ef5350; color: white; border: none; padding: 15px 40px; font-size: 22px; font-weight: bold;
            border-radius: 30px; box-shadow: 0 5px 15px rgba(239, 83, 80, 0.4); cursor: pointer;
        }

        /* 3. 録画中画面 */
        #recording-ui { display: none; }
        
        #countdown {
            position: absolute;
            top: 50px; 
            background: rgba(239, 83, 80, 0.9);
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #stop-btn {
            position: absolute; right: 30px; top: 50%; transform: translateY(-50%);
            background-color: white; color: #ef5350; border: none;
            width: 80px; height: 80px; border-radius: 50%;
            font-size: 18px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer;
        }

        /* 4. ステータス画面 */
        #status-view { display: none; background: rgba(255,255,255,0.95); z-index: 100; }
        #status-text { font-size: 22px; font-weight: bold; color: #333; text-align: center; line-height: 1.6; }
    </style>
</head>
<body>

    <!-- 映像コンテナ -->
    <div id="camera-video-container">
        <video id="camera-video" autoplay muted playsinline></video>
    </div>

    <div id="ui-layer">
        <!-- 1. 事前確認画面 -->
        <div id="check-ui">
            <div id="check-screen">
                <h2>事前準備のお願い</h2>
                <p>綺麗に撮影するために、スマホの<br><span style="color: #ef5350;">「画面回転ロック」を解除</span>してください。</p>
                <label class="checkbox-label">
                    <input type="checkbox" id="rotation-check">
                    ロックを解除して、スマホを横向きに持ち替えました
                </label>
                <button id="next-btn" disabled>次へ進む</button>
            </div>
        </div>

        <div class="rotate-ui">
            <!-- 2. 待機画面 -->
            <div id="ready-ui" class="ui-content">
                <div id="ready-screen">
                    <h2>Happy Wedding!</h2>
                    <p>準備ができたら<br>録画を開始してください</p>
                    <button id="start-btn">録画開始</button>
                </div>
            </div>

            <!-- 3. 録画中画面 -->
            <div id="recording-ui" class="ui-content">
                <div id="countdown">残り 20 秒</div>
                <button id="stop-btn">停止</button>
            </div>

            <!-- 4. ステータス画面 -->
            <div id="status-view" class="ui-content">
                <p id="status-text">準備中...</p>
            </div>
        </div>
    </div>

    <script>
        // === Cloudinary 設定 ===
        const CLOUD_NAME = 'wf1qutrj'; 
        const UPLOAD_PRESET = 'jr3hrfi9';
        const MAX_SECONDS = 20;

        let mediaRecorder;
        let recordedChunks = [];
        let stream;
        let timerInterval;

        window.onload = async () => {
            try {
                // 【修正】カメラの取得時に、録画データ自体を16:9(9:16)にするようにブラウザに要求します
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'user',
                        aspectRatio: { exact: 16/9 } // 録画データの比率を強制
                    },
                    audio: true
                });
                document.getElementById('camera-video').srcObject = stream;
            } catch (err) {
                // 万が一 16:9 に対応していない古いスマホの場合は、デフォルト比率で再試行します
                console.warn('16:9 aspect ratio not supported, falling back to default.');
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user' },
                        audio: true
                    });
                    document.getElementById('camera-video').srcObject = stream;
                } catch (fallbackErr) {
                    alert('カメラとマイクのアクセスを許可してください。');
                    console.error(fallbackErr);
                }
            }
        };

        // チェックボックス処理
        document.getElementById('rotation-check').addEventListener('change', (e) => {
            const btn = document.getElementById('next-btn');
            if (e.target.checked) {
                btn.disabled = false;
                btn.classList.add('active');
            } else {
                btn.disabled = true;
                btn.classList.remove('active');
            }
        });

        // 次へ進むボタン処理
        document.getElementById('next-btn').addEventListener('click', () => {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(e => console.log(e));
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen().catch(e => console.log(e));
            }

            document.getElementById('check-ui').style.display = 'none';
            document.getElementById('ready-ui').style.display = 'flex';
        });

        // 録画開始処理
        document.getElementById('start-btn').addEventListener('click', () => {
            if (!stream) return alert('カメラが準備できていません');

            document.getElementById('ready-ui').style.display = 'none';
            document.getElementById('recording-ui').style.display = 'flex';

            recordedChunks = [];
            
            let options = { mimeType: 'video/mp4' };
            if (!MediaRecorder.isTypeSupported('video/mp4')) {
                options = { mimeType: 'video/webm' };
            }

            mediaRecorder = new MediaRecorder(stream, options);

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = uploadToCloudinary;
            mediaRecorder.start();

            let timeLeft = MAX_SECONDS;
            document.getElementById('countdown').innerText = `残り ${timeLeft} 秒`;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('countdown').innerText = `残り ${timeLeft} 秒`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (mediaRecorder.state === 'recording') mediaRecorder.stop();
                }
            }, 1000);
        });

        // 停止ボタン処理
        document.getElementById('stop-btn').addEventListener('click', () => {
            clearInterval(timerInterval);
            if (mediaRecorder.state === 'recording') mediaRecorder.stop();
        });

        // Cloudinaryへアップロード
        async function uploadToCloudinary() {
            document.getElementById('recording-ui').style.display = 'none';
            const statusView = document.getElementById('status-view');
            statusView.style.display = 'flex';
            document.getElementById('status-text').innerText = '動画を保存しています...\n少々お待ちください';

            const blob = new Blob(recordedChunks, { type: recordedChunks[0].type });
            const formData = new FormData();
            formData.append('file', blob);
            formData.append('upload_preset', UPLOAD_PRESET); 

            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.secure_url) {
                    document.getElementById('status-text').innerHTML = '✨ 撮影完了！ ✨<br>メッセージありがとうございました。<br><br><span style="font-size:16px; color:#666;">画面を閉じて終了してください</span>';
                } else {
                    throw new Error('Upload failed: ' + (data.error ? data.error.message : 'Unknown error'));
                }
            } catch (err) {
                console.error(err);
                document.getElementById('status-text').innerHTML = 'エラーが発生しました。<br>通信環境の良い場所で再試行してください。';
            }
        }
    </script>
</body>
</html>
