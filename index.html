<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wedding Message Booth</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      background: #111; 
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; touch-action: manipulation;
      display: flex; justify-content: center; align-items: center;
    }
    
    /* カメラとUIを包むメインコンテナ（画面ピッタリ） */
    .main-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 動画エリア：正確な3:4 または 9:16 の比率（ここでは 3:4 を採用、9:16に変更可能） */
    .video-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      aspect-ratio: 3 / 4; /* 正確な3:4の比率（9:16にする場合は 9 / 16 に変更） */
      max-height: 100vh;
      background: #000;
    }
    
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      transform: scaleX(-1); /* フロントカメラの左右反転 */
    }

    /* 【超重要】動画の上に重ねる（オーバーレイ）UIブロック。横向きで読めるよう90度回転 */
    .overlay-ui-container {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 25%; /* 動画の上部25%のエリアにふんわり重ねる */
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none; /* 下の要素へのタッチを邪魔しない */
      z-index: 20;
    }

    /* 90度回転させて、縦持ちでも横向きの文字・ボタンとして正しく機能させるボックス */
    .rotated-ui-content {
      /* 回転させるため幅と高さを入れ替える設計 */
      width: 25vh;
      height: 100vw;
      transform: rotate(90deg);
      transform-origin: center center;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      pointer-events: auto; /* この内部のボタン等はタップ可能にする */
      background: rgba(253, 250, 246, 0.9);
      backdrop-filter: blur(4px);
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .text-group { display: flex; flex-direction: column; text-align: left; }
    h2 { color: #d4af37; margin: 0; font-size: 13px; line-height: 1.1; font-weight: bold; white-space: nowrap; }
    p { margin: 0; font-size: 9px; color: #444; white-space: nowrap; }
    
    .controls-group { display: flex; align-items: center; gap: 8px; }
    button {
      padding: 8px 22px; font-size: 12px; border-radius: 20px;
      border: none; cursor: pointer; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      white-space: nowrap;
    }
    #recordBtn { background: #e55039; color: white; }
    #stopBtn { background: #2f3542; color: white; display: none; }
    
    #status { font-size: 9px; font-weight: bold; color: #333; text-align: right; white-space: nowrap; }
    #resultLink { color: #007bff; text-decoration: underline; font-size: 9px; display: block; text-align: right; white-space: nowrap; }

    #timerBadge {
      position: absolute; top: 15px; right: 15px;
      background: rgba(255, 71, 87, 0.9); color: white;
      padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 11px;
      display: none; z-index: 30;
    }

    .hide-during-rec { transition: opacity 0.2s; }
    .recording-mode .hide-during-rec { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  
  <div class="main-container">
    <div class="video-wrapper" id="videoWrapper">
      <div id="timerBadge">残り 20秒</div>
      <video id="preview" autoplay muted playsinline></video>
      <canvas id="recordCanvas" style="display:none;"></canvas>
    </div>

    <!-- 動画の上に重ねた横向きUIコンテナ -->
    <div class="overlay-ui-container" id="overlayContainer">
      <div class="rotated-ui-content">
        <div class="text-group hide-during-rec">
          <h2>Happy Wedding!</h2>
          <p>📱 スマホを横に向けて大勢で撮影しよう</p>
        </div>
        
        <div class="controls-group">
          <button id="recordBtn">録画開始</button>
          <button id="stopBtn">録画ストップ</button>
        </div>
        
        <div class="hide-during-rec">
          <div id="status"></div>
          <a id="resultLink" href="" target="_blank" style="display: none;">🎥 動画を確認</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const cloudName = 'wf1qutrj'; const uploadPreset = 'jr3hrfi9';
    let mediaRecorder, recordedChunks = [], cameraStream, animFrameId, timer, countdownInterval;
    const maxTime = 20, preview = document.getElementById('preview'), canvas = document.getElementById('recordCanvas'), ctx = canvas.getContext('2d');
    const recordBtn = document.getElementById('recordBtn'), stopBtn = document.getElementById('stopBtn'), status = document.getElementById('status'), timerBadge = document.getElementById('timerBadge'), resultLink = document.getElementById('resultLink'), overlayContainer = document.getElementById('overlayContainer');

    async function initCamera() {
      try {
        // 3:4の比率ベースでカメラ解像度を取得（9:16にする場合は height: 1280, width: 720 に変更）
        cameraStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user", width: { ideal: 960 }, height: { ideal: 1280 }, frameRate: { ideal: 30 } }, 
          audio: true 
        });
        preview.srcObject = cameraStream;
      } catch (e) {
        try { 
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true }); 
          preview.srcObject = cameraStream; 
        } catch (err) { 
          status.innerText = 'カメラ許可必要🙏'; 
        }
      }
    }
    initCamera();

    function drawFrame() {
      if (preview.readyState >= preview.HAVE_CURRENT_DATA) {
        let vW = preview.videoWidth, vH = preview.videoHeight;
        if (vW > 0 && vH > 0) {
          let targetW = 960;
          let targetH = 1280; // 3:4の縦長解像度で録画データを作成
          if (canvas.width !== targetW || canvas.height !== targetH) {
            canvas.width = targetW;
            canvas.height = targetH;
          }
          ctx.clearRect(0, 0, targetW, targetH);
          ctx.save();
          ctx.translate(targetW, 0);
          ctx.scale(-1, 1); // 左右反転
          
          let sRatio = vW / vH;
          let tRatio = targetW / targetH;
          let sW, sH, sX, sY;
          if (sRatio > tRatio) {
            sH = vH; sW = vH * tRatio;
            sX = (vW - sW) / 2; sY = 0;
          } else {
            sW = vW; sH = vW / tRatio;
            sX = 0; sY = (vH - sH) / 2;
          }
          ctx.drawImage(preview, sX, sY, sW, sH, 0, 0, targetW, targetH);
          ctx.restore();
        }
      }
      animFrameId = requestAnimationFrame(drawFrame);
    }

    recordBtn.addEventListener('click', () => {
      recordedChunks = []; resultLink.style.display = 'none';
      overlayContainer.classList.add('recording-mode');
      drawFrame();
      const canvasStream = canvas.captureStream(30);
      if (cameraStream.getAudioTracks().length > 0) canvasStream.addTrack(cameraStream.getAudioTracks()[0]);
      
      try { mediaRecorder = new MediaRecorder(canvasStream, { videoBitsPerSecond: 2000000 }); } 
      catch (e) { mediaRecorder = new MediaRecorder(canvasStream); }

      mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        cancelAnimationFrame(animFrameId); clearInterval(countdownInterval); clearTimeout(timer); timerBadge.style.display = 'none';
        overlayContainer.classList.remove('recording-mode');
        status.innerText = '送信中... ⏳'; recordBtn.style.display = 'none'; stopBtn.style.display = 'none';
        
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
        const formData = new FormData(); formData.append('file', blob); formData.append('upload_preset', uploadPreset);
        try {
          const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, { method: 'POST', body: formData });
          const json = await res.json();
          if (res.ok && json.secure_url) {
            status.innerText = '送信完了！🎉'; status.style.color = '#2ed573';
            resultLink.href = json.secure_url; resultLink.style.display = 'inline';
          } else { throw new Error(json.error?.message || 'エラー'); }
        } catch (err) {
          status.innerText = `エラー: ${err.message}`; status.style.color = 'red'; recordBtn.style.display = 'inline-block';
        }
      };

      mediaRecorder.start(250);
      recordBtn.style.display = 'none'; stopBtn.style.display = 'inline-block';
      let timeLeft = maxTime; timerBadge.innerText = `残り ${timeLeft}秒`; timerBadge.style.display = 'block';
      countdownInterval = setInterval(() => { if (--timeLeft >= 0) timerBadge.innerText = `残り ${timeLeft}秒`; }, 1000);
      timer = setTimeout(() => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); }, maxTime * 1000);
    });

    stopBtn.addEventListener('click', () => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); });
  </script>
</body>
</html>
