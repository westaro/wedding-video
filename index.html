<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wedding Message Booth - Fullscreen</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      text-align: center; 
      background: #fdfaf6; 
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; touch-action: manipulation;
      display: flex; justify-content: center; align-items: center;
    }
    .screen-rotator {
      width: 100vh; height: 100vw;
      transform: rotate(90deg);
      transform-origin: center center;
      position: absolute;
      display: flex; flex-direction: column;
      justify-content: space-between; align-items: center;
      background: #fdfaf6; padding: 10px;
    }
    .top-panel { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    h2 { color: #d4af37; margin: 0; font-size: 18px; }
    p { margin: 0; font-size: 13px; color: #555; }
    
    /* 画面いっぱいに広げ、object-fit: cover で黒帯を完全に排除するコンテナ */
    .video-container {
      width: 100%;
      flex-grow: 1;
      max-height: calc(100vh - 120px);
      aspect-ratio: 9 / 16; /* スマホ縦持ち基準で画面一杯にフィット */
      border-radius: 16px; overflow: hidden;
      background: #000; box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      position: relative;
      margin: 5px 0;
    }
    
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; /* プレビュー側の黒帯も強制的に排除 */
      transform: rotate(-90deg) scaleX(-1); 
    }

    #timerBadge {
      position: absolute; top: 10px; right: 10px;
      background: rgba(255, 71, 87, 0.85); color: white;
      padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 13px;
      display: none; z-index: 10;
    }
    .controls { margin: 0; }
    button {
      padding: 10px 30px; font-size: 15px; border-radius: 30px;
      border: none; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #recordBtn { background: #e55039; color: white; }
    #stopBtn { background: #2f3542; color: white; display: none; }
    #status { margin-top: 3px; font-weight: bold; font-size: 12px; min-height: 18px; }
    #resultLink { display: block; margin-top: 2px; color: #007bff; text-decoration: underline; font-size: 12px; }
    .recording-mode .hide-during-rec { display: none !important; }
  </style>
</head>
<body>
  <div class="screen-rotator" id="screenRotator">
    <div class="top-panel hide-during-rec">
      <h2>Happy Wedding!</h2>
      <p>📱 横向きで撮影してください</p>
    </div>
    <div class="video-container">
      <div id="timerBadge">残り 20秒</div>
      <video id="preview" autoplay muted playsinline></video>
      <canvas id="recordCanvas" style="display:none;"></canvas>
    </div>
    <div class="bottom-panel">
      <div class="controls">
        <button id="recordBtn">録画開始</button>
        <button id="stopBtn">録画ストップ</button>
      </div>
      <div id="status" class="hide-during-rec"></div>
      <a id="resultLink" href="" target="_blank" style="display: none;" class="hide-during-rec">🎥 保存された動画を確認する</a>
    </div>
  </div>
  <script>
    const cloudName = 'wf1qutrj'; const uploadPreset = 'jr3hrfi9';
    let mediaRecorder, recordedChunks = [], cameraStream, recordStream, animFrameId, timer, countdownInterval;
    const maxTime = 20, preview = document.getElementById('preview'), canvas = document.getElementById('recordCanvas'), ctx = canvas.getContext('2d');
    const recordBtn = document.getElementById('recordBtn'), stopBtn = document.getElementById('stopBtn'), status = document.getElementById('status'), timerBadge = document.getElementById('timerBadge'), resultLink = document.getElementById('resultLink'), screenRotator = document.getElementById('screenRotator');

    async function initCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: "user", 
            width: { ideal: 1080 }, 
            height: { ideal: 1920 }, 
            frameRate: { ideal: 30 } 
          }, 
          audio: true 
        });
        preview.srcObject = cameraStream;
      } catch (e) {
        try { 
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true }); 
          preview.srcObject = cameraStream; 
        } catch (err) { 
          status.innerText = 'カメラとマイクのアクセスを許可してください🙏'; 
        }
      }
    }
    initCamera();

    function drawFrame() {
      if (preview.readyState >= preview.HAVE_CURRENT_DATA) {
        let vW = preview.videoWidth, vH = preview.videoHeight;
        if (vW > 0 && vH > 0) {
          // スマホ画面の解像度（縦向きベース）に合わせることで、録画データ自体にも黒帯が入らないようにする
          let targetW = 1080;
          let targetH = 1920;
          if (canvas.width !== targetW || canvas.height !== targetH) {
            canvas.width = targetW;
            canvas.height = targetH;
          }
          ctx.clearRect(0, 0, targetW, targetH);
          ctx.save();
          ctx.translate(targetW / 2, targetH / 2);
          ctx.rotate(-Math.PI / 2);
          ctx.scale(-1, 1);
          
          // 画面全体を隙間なく埋める（object-fit: cover と同じ切り出し計算）
          let scale = Math.max(targetW / vH, targetH / vW);
          let dW = vH * scale;
          let dH = vW * scale;
          ctx.drawImage(preview, -dW / 2, -dH / 2, dW, dH);
          ctx.restore();
        }
      }
      animFrameId = requestAnimationFrame(drawFrame);
    }

    recordBtn.addEventListener('click', () => {
      recordedChunks = []; resultLink.style.display = 'none';
      screenRotator.classList.add('recording-mode');
      drawFrame();
      const canvasStream = canvas.captureStream(30);
      if (cameraStream.getAudioTracks().length > 0) canvasStream.addTrack(cameraStream.getAudioTracks()[0]);
      
      try { mediaRecorder = new MediaRecorder(canvasStream, { videoBitsPerSecond: 2000000 }); } 
      catch (e) { mediaRecorder = new MediaRecorder(canvasStream); }

      mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        cancelAnimationFrame(animFrameId); clearInterval(countdownInterval); clearTimeout(timer); timerBadge.style.display = 'none';
        screenRotator.classList.remove('recording-mode');
        status.innerText = '送信中... ⏳'; recordBtn.style.display = 'none'; stopBtn.style.display = 'none';
        
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
        const formData = new FormData(); formData.append('file', blob); formData.append('upload_preset', uploadPreset);
        try {
          const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, { method: 'POST', body: formData });
          const json = await res.json();
          if (res.ok && json.secure_url) {
            status.innerText = '送信完了！ありがとうございました🎉'; status.style.color = '#2ed573';
            resultLink.href = json.secure_url; resultLink.style.display = 'block';
          } else { throw new Error(json.error?.message || 'エラー'); }
        } catch (err) {
          status.innerText = `送信エラー: ${err.message}`; status.style.color = 'red'; recordBtn.style.display = 'inline-block';
        }
      };

      mediaRecorder.start(250);
      recordBtn.style.display = 'none'; stopBtn.style.display = 'inline-block';
      let timeLeft = maxTime; timerBadge.innerText = `残り ${timeLeft}秒`; timerBadge.style.display = 'block';
      countdownInterval = setInterval(() => { if (--timeLeft >= 0) timerBadge.innerText = `残り ${timeLeft}秒`; }, 1000);
      timer = setTimeout(() => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); }, maxTime * 1000);
    });

    stopBtn.addEventListener('click', () => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); });
  </script>
</body>
</html>
