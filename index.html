<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホでの拡大縮小を禁止し、アプリのように見せる設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Message Booth</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #fcf9f9; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }

        /* === 待機画面 (添付画像 S__69566469.jpg のレイアウト) === */
        #initial-view {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* カメラプレビュー (中央) */
        #camera-preview {
            width: 50%;
            height: 60%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* テキストエリア (右側・縦書き/回転) */
        .text-overlay {
            position: absolute;
            right: 20px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg); /* スマホを横向きにしたときに正しく読めるように */
            color: #333;
        }
        .text-overlay h2 { color: #d4af37; font-size: 24px; margin-bottom: 10px; font-family: serif; }
        .text-overlay p { font-size: 16px; font-weight: bold; }

        /* 録画開始ボタン (左側・回転) */
        #start-btn {
            position: absolute;
            left: 20px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            background-color: #ef5350;
            color: white;
            border: none;
            padding: 20px 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(239, 83, 80, 0.4);
            cursor: pointer;
        }

        /* === 録画中画面 (全画面 9:16) === */
        #recording-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
        }
        #recording-preview {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 画面いっぱいに9:16で表示 */
        }
        
        /* 録画停止ボタン (右端に配置) */
        #stop-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background-color: white;
            color: #ef5350;
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        /* 残り時間プログレスバー */
        #progress-bar {
            position: absolute;
            bottom: 20px;
            left: 5%;
            width: 90%;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: #ef5350;
            border-radius: 4px;
            transition: width 1s linear;
        }

        /* === アップロード中・完了画面 === */
        #status-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255,255,255,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            text-align: center;
            flex-direction: column;
            z-index: 100;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 待機画面 -->
    <div id="initial-view">
        <video id="camera-preview" autoplay muted playsinline></video>
        <div class="text-overlay">
            <h2>Happy Wedding!</h2>
            <p>📷 横向きで撮影してください</p>
        </div>
        <button id="start-btn">録画開始</button>
    </div>

    <!-- 録画中画面 -->
    <div id="recording-view">
        <video id="recording-preview" autoplay muted playsinline></video>
        <button id="stop-btn">停止</button>
        <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <!-- ステータス画面 (初期は非表示) -->
    <div id="status-view" class="hidden">
        <p id="status-text">準備中...</p>
    </div>

    <script>
        // --- 設定エリア ---
        const CLOUD_NAME = 'wf1qutrj'; // ご指定のCloudinary名
        const UPLOAD_PRESET = 'wedding_preset'; // ステップ1で作ったプリセット名を入力してください
        const MAX_RECORDING_TIME = 20000; // 20秒 (ミリ秒)

        let mediaRecorder;
        let recordedChunks = [];
        let stream;
        let timerInterval;

        // ページ読み込み時にカメラを起動
        window.onload = async () => {
            document.getElementById('status-view').classList.add('hidden');
            try {
                // カメラの設定: 9:16の比率を要求し、インカメラ(user)を使用
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', aspectRatio: 9 / 16 },
                    audio: true
                });
                document.getElementById('camera-preview').srcObject = stream;
                document.getElementById('recording-preview').srcObject = stream;
            } catch (err) {
                alert('カメラとマイクのアクセスを許可してください。');
                console.error(err);
            }
        };

        // 録画開始ボタンの処理
        document.getElementById('start-btn').addEventListener('click', () => {
            if (!stream) return alert('カメラが準備できていません');

            // 画面の切り替え
            document.getElementById('initial-view').style.display = 'none';
            document.getElementById('recording-view').style.display = 'block';

            recordedChunks = [];
            
            // iPhone(Safari)向けの形式互換性を考慮
            let options = { mimeType: 'video/mp4' };
            if (!MediaRecorder.isTypeSupported('video/mp4')) {
                options = { mimeType: 'video/webm' };
            }

            mediaRecorder = new MediaRecorder(stream, options);

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = uploadToCloudinary;
            mediaRecorder.start();

            // 20秒のプログレスバーアニメーションと自動停止
            let timeLeft = 0;
            document.getElementById('progress-fill').style.width = '0%';
            timerInterval = setInterval(() => {
                timeLeft += 1000;
                let percent = (timeLeft / MAX_RECORDING_TIME) * 100;
                document.getElementById('progress-fill').style.width = percent + '%';
                
                if (timeLeft >= MAX_RECORDING_TIME) {
                    clearInterval(timerInterval);
                    if (mediaRecorder.state === 'recording') mediaRecorder.stop();
                }
            }, 1000);
        });

        // 録画停止ボタンの処理
        document.getElementById('stop-btn').addEventListener('click', () => {
            clearInterval(timerInterval);
            if (mediaRecorder.state === 'recording') mediaRecorder.stop();
        });

        // Cloudinaryへのアップロード処理
        async function uploadToCloudinary() {
            // UIをアップロード中に切り替え
            document.getElementById('recording-view').style.display = 'none';
            const statusView = document.getElementById('status-view');
            statusView.classList.remove('hidden');
            document.getElementById('status-text').innerText = '動画を保存しています...\n少々お待ちください';

            // 動画データの作成
            const blob = new Blob(recordedChunks, { type: recordedChunks[0].type });
            const formData = new FormData();
            formData.append('file', blob);
            formData.append('upload_preset', UPLOAD_PRESET); 

            try {
                // CloudinaryのAPIへPOST送信
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.secure_url) {
                    document.getElementById('status-text').innerHTML = '✨ 撮影完了！ ✨<br>メッセージありがとうございました。<br><br><span style="font-size:14px; color:#666;">画面を閉じて終了してください</span>';
                } else {
                    throw new Error('Upload failed');
                }
            } catch (err) {
                console.error(err);
                document.getElementById('status-text').innerHTML = 'エラーが発生しました。<br>通信環境の良い場所で再試行してください。';
            }
        }
    </script>
</body>
</html>
