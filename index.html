<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wedding Video Recorder</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .camera-card {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 450px;
      max-height: 800px;
      aspect-ratio: 9 / 16;
      background: #111;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .header-overlay {
      position: relative;
      z-index: 10;
      padding: 20px;
      text-align: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
    }
    .timer {
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      letter-spacing: 1px;
    }
    .footer-overlay {
      position: relative;
      z-index: 10;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(0deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
    }
    .record-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: #ff4757;
      cursor: pointer;
      outline: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s ease;
    }
    .record-btn:active { transform: scale(0.92); }
    .record-btn:disabled { background: #888; border-color: #ccc; cursor: not-allowed; }
    
    .status-modal {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="camera-card">
    <div class="header-overlay">
      <div id="timer" class="timer">撮影可能時間: 20秒</div>
    </div>

    <video id="preview" autoplay playsinline muted></video>

    <div class="footer-overlay">
      <button id="recordBtn" class="record-btn"></button>
    </div>

    <div id="statusModal" class="status-modal hidden">
      <h2 id="statusTitle" style="margin-bottom: 12px;">送信中...</h2>
      <p id="statusDesc" style="color: #ccc; line-height: 1.5;">動画を保存しています。<br>画面を閉じずにお待ちください。</p>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw9oglBwZb9rC8LcyXmT0yppsie8PcNaFPitNDMKIDm4nK0PQ-8E3jPXk2dIwfY9hZ1-w/exec";
    const MAX_SECONDS = 20;

    let mediaRecorder;
    let recordedChunks = [];
    let timerInterval = null;
    let secondsLeft = MAX_SECONDS;

    const preview = document.getElementById('preview');
    const recordBtn = document.getElementById('recordBtn');
    const timerDisplay = document.getElementById('timer');
    const statusModal = document.getElementById('statusModal');
    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');

    // カメラ起動処理（インカメラ・縦型9:16優先指定）
    async function setupCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            aspectRatio: { ideal: 9 / 16 },
            width: { ideal: 720 },
            height: { ideal: 1280 }
          },
          audio: true
        });
        preview.srcObject = stream;

        const mimeType = getSupportedMimeType();
        mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = uploadVideo;
      } catch (err) {
        alert("カメラとマイクのアクセスを許可してください。");
        console.error(err);
      }
    }

    function getSupportedMimeType() {
      const types = ['video/webm;codecs=vp9', 'video/webm', 'video/mp4'];
      for (let type of types) {
        if (MediaRecorder.isTypeSupported(type)) return type;
      }
      return '';
    }

    // 録画開始
    recordBtn.addEventListener('click', () => {
      recordedChunks = [];
      mediaRecorder.start();
      recordBtn.disabled = true;
      startCountdown();
    });

    // カウントダウン
    function startCountdown() {
      secondsLeft = MAX_SECONDS;
      timerDisplay.textContent = `残り ${secondsLeft} 秒`;

      timerInterval = setInterval(() => {
        secondsLeft--;
        timerDisplay.textContent = `残り ${secondsLeft} 秒`;

        if (secondsLeft <= 0) {
          stopRecording();
        }
      }, 1000);
    }

    // 録画停止
    function stopRecording() {
      clearInterval(timerInterval);
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    // ドライブへ送信
    function uploadVideo() {
      statusModal.classList.remove('hidden');

      const blob = new Blob(recordedChunks, { type: 'video/mp4' });
      const reader = new FileReader();

      reader.readAsDataURL(blob);
      reader.onloadend = async () => {
        const base64Data = reader.result;

        try {
          await fetch(GAS_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ file: base64Data })
          });

          statusTitle.textContent = "送信完了！";
          statusDesc.innerHTML = "素敵なメッセージをありがとうございました✨<br>動画を正常に受け取りました。";
        } catch (err) {
          console.error(err);
          statusTitle.textContent = "エラーが発生しました";
          statusDesc.textContent = "送信に失敗しました。お手数ですが再読込してお試しください。";
        }
      };
    }

    setupCamera();
  </script>
</body>
</html>
