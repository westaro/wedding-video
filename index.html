<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wedding Message Booth</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #fdfaf6;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #333;
      overflow: hidden;
    }

    /* 横向きレイアウト */
    .app-layout {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      padding: 10px;
      gap: 15px;
    }

    /* 動画コンテナ（16:9 / 4:3 対応） */
    .video-container {
      height: 85vh;
      aspect-ratio: 16 / 9;
      max-width: 60vw;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      position: relative;
      flex-shrink: 0;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #timerBadge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 71, 87, 0.9);
      color: white;
      padding: 4px 12px;
      border-radius: 16px;
      font-weight: bold;
      font-size: 13px;
      display: none;
      backdrop-filter: blur(4px);
    }

    /* 右側の操作パネル */
    .side-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex: 1;
      height: 100%;
      padding: 5px;
    }

    h2 { color: #d4af37; margin: 0 0 5px 0; font-size: 20px; }
    p { margin: 0 0 10px 0; font-size: 13px; }

    .controls { margin-top: 5px; }
    button { 
      padding: 12px 30px; 
      font-size: 16px; 
      border-radius: 25px; 
      border: none; 
      cursor: pointer; 
      font-weight: bold; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #recordBtn { background: #e55039; color: white; }
    #recordBtn:active { background: #eb2f06; }
    #stopBtn { background: #2f3542; color: white; display: none; }
    #status { margin-top: 10px; font-weight: bold; font-size: 13px; word-break: break-all; }
    #resultLink { display: block; margin-top: 8px; color: #007bff; text-decoration: underline; font-weight: bold; font-size: 12px; }

    /* 縦持ち時（幅より高さが大きい場合）のみ案内を表示 */
    @media (aspect-ratio: 1/1) or (max-aspect-ratio: 13/10) {
      .app-layout { display: none !important; }
      .rotate-notice {
        display: flex !important;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.92);
        color: #fff;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: bold;
        z-index: 9999;
        padding: 20px;
        text-align: center;
      }
    }

    .rotate-notice { display: none; }
  </style>
</head>
<body>

  <div class="rotate-notice">
    📱 スマホを横向きにして撮影してください
  </div>

  <div class="app-layout">
    <div class="video-container">
      <div id="timerBadge">残り 20秒</div>
      <video id="preview" autoplay muted playsinline></video>
    </div>

    <div class="side-panel">
      <h2>Happy Wedding!</h2>
      <p>お祝いメッセージをお願いします🎥（最大20秒）</p>
      
      <div class="controls">
        <button id="recordBtn">録画開始</button>
        <button id="stopBtn">録画ストップ</button>
      </div>
      <div id="status"></div>
      <a id="resultLink" href="" target="_blank" style="display: none;">🎥 保存された動画を確認する</a>
    </div>
  </div>

  <script>
    const cloudName = 'wf1qutrj'; 
    const uploadPreset = 'jr3hrfi9'; 

    let mediaRecorder;
    let recordedChunks = [];
    let cameraStream;
    let maxTime = 20;
    let timeLeft = maxTime;
    let timer;
    let countdownInterval;

    const preview = document.getElementById('preview');
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');
    const timerBadge = document.getElementById('timerBadge');
    const resultLink = document.getElementById('resultLink');

    function getSupportedMimeType() {
      const types = [
        'video/mp4;codecs=avc1.640028',
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
      ];
      for (const t of types) {
        if (MediaRecorder.isTypeSupported(t)) return t;
      }
      return '';
    }

    async function initCamera() {
      try {
        // 横画面用のカメラ設定（16:9〜4:3に対応する理想解像度）
        cameraStream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 30 }
          }, 
          audio: true 
        });

        preview.srcObject = cameraStream;
      } catch (err) {
        status.innerText = 'カメラとマイクのアクセスを許可してください🙏';
        status.style.color = 'red';
      }
    }

    initCamera();

    recordBtn.addEventListener('click', () => {
      recordedChunks = [];
      resultLink.style.display = 'none';
      const mimeType = getSupportedMimeType();

      const options = { videoBitsPerSecond: 4000000 };
      if (mimeType) { options.mimeType = mimeType; }

      mediaRecorder = new MediaRecorder(cameraStream, options);

      mediaRecorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = async () => {
        clearInterval(countdownInterval);
        clearTimeout(timer);
        timerBadge.style.display = 'none';

        status.innerText = '送信中... ⏳';
        status.style.color = '#333';
        recordBtn.style.display = 'none';
        stopBtn.style.display = 'none';

        const actualType = mediaRecorder.mimeType || mimeType || 'video/webm';
        const blob = new Blob(recordedChunks, { type: actualType });

        const formData = new FormData();
        formData.append('file', blob);
        formData.append('upload_preset', uploadPreset);
        formData.append('angle', '0'); // 横長を維持して格納

        try {
          const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, {
            method: 'POST',
            body: formData
          });

          const result = await response.json();
          if (response.ok && result.secure_url) {
            status.innerText = '送信完了！ありがとうございました🎉';
            status.style.color = '#2ed573';
            
            resultLink.href = result.secure_url;
            resultLink.style.display = 'block';
          } else {
            console.error('Cloudinary Error:', result);
            throw new Error(result.error ? result.error.message : '送信に失敗しました');
          }
        } catch (error) {
          console.error(error);
          status.innerText = '送信エラーが発生しました。設定を確認してください。';
          status.style.color = 'red';
        }
      };

      mediaRecorder.start(1000);
      recordBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';

      timeLeft = maxTime;
      timerBadge.innerText = `残り ${timeLeft}秒`;
      timerBadge.style.display = 'block';
      status.innerText = `🔴 録画中... (残り ${timeLeft}秒)`;
      status.style.color = '#ff4757';

      countdownInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft >= 0) {
          timerBadge.innerText = `残り ${timeLeft}秒`;
          status.innerText = `🔴 録画中... (残り ${timeLeft}秒)`;
        }
      }, 1000);

      timer = setTimeout(() => {
        if (mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }
      }, maxTime * 1000);
    });

    stopBtn.addEventListener('click', () => {
      if (mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    });
  </script>
</body>
</html>
