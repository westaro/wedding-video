<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wedding Message Booth</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      text-align: center; 
      background: #fdfaf6; 
      padding: 15px; 
      color: #333; 
      margin: 0;
      /* 画面の不要なスクロールや勝手な挙動を防止 */
      touch-action: manipulation;
    }

    h2 { color: #d4af37; margin-bottom: 5px; margin-top: 10px; }
    p { margin-bottom: 15px; font-size: 14px; }
    
    .video-container {
      width: 100%;
      max-width: 330px;
      margin: 0 auto;
      aspect-ratio: 3 / 4;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      position: relative;
    }
    
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* インカメラの左右反転（鏡像）を自然な向きに正す */
      transform: scaleX(-1);
    }

    #timerBadge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 71, 87, 0.85);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      display: none;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 10;
    }

    .controls { margin-top: 20px; }
    button { 
      padding: 15px 40px; 
      font-size: 18px; 
      border-radius: 30px; 
      border: none; 
      cursor: pointer; 
      font-weight: bold; 
      transition: 0.3s; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #recordBtn { background: #e55039; color: white; }
    #recordBtn:active { background: #eb2f06; }
    #stopBtn { background: #2f3542; color: white; display: none; }
    #status { margin-top: 15px; font-weight: bold; font-size: 15px; min-height: 24px; word-break: break-all; }
    #resultLink { display: block; margin-top: 10px; color: #007bff; text-decoration: underline; font-weight: bold; }

    /* 横向きに傾けた際にOSの自動回転で上下反転するのを抑止 */
    @media screen and (orientation: landscape) {
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .video-container {
        max-width: 260px; /* 横画面時も収まるサイズ調整 */
      }
    }
  </style>
</head>
<body>
  <h2>Happy Wedding!</h2>
  <p>お祝いメッセージをお願いします🎥（最大20秒）</p>
  
  <div class="video-container">
    <div id="timerBadge">残り 20秒</div>
    <video id="preview" autoplay muted playsinline></video>
  </div>
  
  <div class="controls">
    <button id="recordBtn">録画開始</button>
    <button id="stopBtn">録画ストップ</button>
  </div>
  <div id="status"></div>
  <a id="resultLink" href="" target="_blank" style="display: none;">🎥 保存された動画を確認する</a>

  <script>
    const cloudName = 'wf1qutrj'; 
    const uploadPreset = 'jr3hrfi9'; 

    let mediaRecorder;
    let recordedChunks = [];
    let cameraStream;
    let maxTime = 20;
    let timeLeft = maxTime;
    let timer;
    let countdownInterval;

    const preview = document.getElementById('preview');
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');
    const timerBadge = document.getElementById('timerBadge');
    const resultLink = document.getElementById('resultLink');

    function getSupportedMimeType() {
      const types = [
        'video/mp4;codecs=avc1.640028',
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
      ];
      for (const t of types) {
        if (MediaRecorder.isTypeSupported(t)) return t;
      }
      return '';
    }

    async function initCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: "user",
            width: { ideal: 960 },
            height: { ideal: 1280 },
            aspectRatio: { ideal: 0.75 },
            frameRate: { ideal: 30 }
          }, 
          audio: true 
        });

        preview.srcObject = cameraStream;
      } catch (err) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
              facingMode: "user",
              aspectRatio: { ideal: 0.75 },
              width: { ideal: 720 },
              height: { ideal: 960 }
            }, 
            audio: true 
          });
          preview.srcObject = cameraStream;
        } catch (e) {
          status.innerText = 'カメラとマイクのアクセスを許可してください🙏';
          status.style.color = 'red';
        }
      }
    }

    initCamera();

    recordBtn.addEventListener('click', () => {
      recordedChunks = [];
      resultLink.style.display = 'none';
      const mimeType = getSupportedMimeType();

      const options = { videoBitsPerSecond: 4000000 };
      if (mimeType) { options.mimeType = mimeType; }

      mediaRecorder = new MediaRecorder(cameraStream, options);

      mediaRecorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = async () => {
        clearInterval(countdownInterval);
        clearTimeout(timer);
        timerBadge.style.display = 'none';

        status.innerText = '送信中... ⏳';
        status.style.color = '#333';
        recordBtn.style.display = 'none';
        stopBtn.style.display = 'none';

        const actualType = mediaRecorder.mimeType || mimeType || 'video/webm';
        const blob = new Blob(recordedChunks, { type: actualType });

        const formData = new FormData();
        formData.append('file', blob);
        formData.append('upload_preset', uploadPreset);

        try {
          const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, {
            method: 'POST',
            body: formData
          });

          const result = await response.json();
          if (response.ok && result.secure_url) {
            status.innerText = '送信完了！ありがとうございました🎉';
            status.style.color = '#2ed573';
            
            resultLink.href = result.secure_url;
            resultLink.style.display = 'block';
          } else {
            console.error('Cloudinary Error:', result);
            throw new Error(result.error ? result.error.message : '送信に失敗しました');
          }
        } catch (error) {
          console.error(error);
          status.innerText = '送信エラーが発生しました。設定を確認してください。';
          status.style.color = 'red';
        }
      };

      mediaRecorder.start(1000);
      recordBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';

      timeLeft = maxTime;
      timerBadge.innerText = `残り ${timeLeft}秒`;
      timerBadge.style.display = 'block';
      status.innerText = `🔴 録画中... (残り ${timeLeft}秒)`;
      status.style.color = '#ff4757';

      countdownInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft >= 0) {
          timerBadge.innerText = `残り ${timeLeft}秒`;
          status.innerText = `🔴 録画中... (残り ${timeLeft}秒)`;
        }
      }, 1000);

      timer = setTimeout(() => {
        if (mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }
      }, maxTime * 1000);
    });

    stopBtn.addEventListener('click', () => {
      if (mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    });
  </script>
</body>
</html>
