<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wedding Message Booth</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      background: #fdfaf6; 
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; touch-action: manipulation;
      display: flex; flex-direction: column;
      justify-content: space-between; align-items: center;
      padding: 12px 16px;
    }
    
    /* 上部：テキストエリア（完全に収まるスッキリした横書き） */
    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 2px;
      width: 100%;
      z-index: 10;
    }
    h2 { color: #d4af37; margin: 0; font-size: 16px; font-weight: bold; }
    p { margin: 0; font-size: 11px; color: #666; }

    /* 中央：カメラエリア（比率 9:16 または 3:4 を厳守、画面内に綺麗に収める） */
    .video-container {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 9 / 16; /* 縦長9:16の比率（3:4にする場合は 3 / 4 に変更可能） */
      max-height: 62vh;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      position: relative;
      margin: auto 0;
    }
    
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      transform: scaleX(-1); /* フロントカメラの左右反転 */
    }

    #timerBadge {
      position: absolute; top: 12px; right: 12px;
      background: rgba(255, 71, 87, 0.9); color: white;
      padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 12px;
      display: none; z-index: 10;
    }

    /* 下部：操作ボタンとステータス */
    .bottom-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
      z-index: 10;
    }

    button {
      padding: 10px 32px; font-size: 15px; border-radius: 30px;
      border: none; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    #recordBtn { background: #e55039; color: white; }
    #stopBtn { background: #2f3542; color: white; display: none; }
    
    #status { font-size: 11px; font-weight: bold; min-height: 14px; color: #333; }
    #resultLink { color: #007bff; text-decoration: underline; font-size: 11px; display: none; }

    .hide-during-rec { transition: opacity 0.2s; }
    .recording-mode .hide-during-rec { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  
  <!-- 上部：テキスト案内 -->
  <div class="top-section hide-during-rec" id="topSection">
    <h2>Happy Wedding!</h2>
    <p>スマホを縦に向けてメッセージを残そう✨</p>
  </div>
  
  <!-- 中央：カメラプレビュー（9:16 縦長） -->
  <div class="video-container" id="videoContainer">
    <div id="timerBadge">残り 20秒</div>
    <video id="preview" autoplay muted playsinline></video>
    <canvas id="recordCanvas" style="display:none;"></canvas>
  </div>
  
  <!-- 下部：ボタン・ステータス -->
  <div class="bottom-section" id="bottomSection">
    <div class="controls">
      <button id="recordBtn">録画開始</button>
      <button id="stopBtn">録画ストップ</button>
    </div>
    <div id="status" class="hide-during-rec"></div>
    <a id="resultLink" href="" target="_blank" class="hide-during-rec">🎥 保存された動画を確認する</a>
  </div>

  <script>
    const cloudName = 'wf1qutrj'; const uploadPreset = 'jr3hrfi9';
    let mediaRecorder, recordedChunks = [], cameraStream, animFrameId, timer, countdownInterval;
    const maxTime = 20, preview = document.getElementById('preview'), canvas = document.getElementById('recordCanvas'), ctx = canvas.getContext('2d');
    const recordBtn = document.getElementById('recordBtn'), stopBtn = document.getElementById('stopBtn'), status = document.getElementById('status'), timerBadge = document.getElementById('timerBadge'), resultLink = document.getElementById('resultLink'), videoContainer = document.getElementById('videoContainer'), topSection = document.getElementById('topSection'), bottomSection = document.getElementById('bottomSection');

    async function initCamera() {
      try {
        // 縦長（9:16）の解像度ベースでカメラを取得
        cameraStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 1280 }, frameRate: { ideal: 30 } }, 
          audio: true 
        });
        preview.srcObject = cameraStream;
      } catch (e) {
        try { 
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true }); 
          preview.srcObject = cameraStream; 
        } catch (err) { 
          status.innerText = 'カメラとマイクの許可が必要です🙏'; 
        }
      }
    }
    initCamera();

    function drawFrame() {
      if (preview.readyState >= preview.HAVE_CURRENT_DATA) {
        let vW = preview.videoWidth, vH = preview.videoHeight;
        if (vW > 0 && vH > 0) {
          let targetW = 720;
          let targetH = 1280; // 9:16の縦長解像度で録画データを作成
          if (canvas.width !== targetW || canvas.height !== targetH) {
            canvas.width = targetW;
            canvas.height = targetH;
          }
          ctx.clearRect(0, 0, targetW, targetH);
          ctx.save();
          ctx.translate(targetW, 0);
          ctx.scale(-1, 1); // 左右反転
          
          let sRatio = vW / vH;
          let tRatio = targetW / targetH;
          let sW, sH, sX, sY;
          if (sRatio > tRatio) {
            sH = vH; sW = vH * tRatio;
            sX = (vW - sW) / 2; sY = 0;
          } else {
            sW = vW; sH = vW / tRatio;
            sX = 0; sY = (vH - sH) / 2;
          }
          ctx.drawImage(preview, sX, sY, sW, sH, 0, 0, targetW, targetH);
          ctx.restore();
        }
      }
      animFrameId = requestAnimationFrame(drawFrame);
    }

    recordBtn.addEventListener('click', () => {
      recordedChunks = []; resultLink.style.display = 'none';
      topSection.classList.add('recording-mode');
      bottomSection.classList.add('recording-mode');
      drawFrame();
      const canvasStream = canvas.captureStream(30);
      if (cameraStream.getAudioTracks().length > 0) canvasStream.addTrack(cameraStream.getAudioTracks()[0]);
      
      try { mediaRecorder = new MediaRecorder(canvasStream, { videoBitsPerSecond: 2000000 }); } 
      catch (e) { mediaRecorder = new MediaRecorder(canvasStream); }

      mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        cancelAnimationFrame(animFrameId); clearInterval(countdownInterval); clearTimeout(timer); timerBadge.style.display = 'none';
        topSection.classList.remove('recording-mode');
        bottomSection.classList.remove('recording-mode');
        status.innerText = '送信中... ⏳'; recordBtn.style.display = 'none'; stopBtn.style.display = 'none';
        
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
        const formData = new FormData(); formData.append('file', blob); formData.append('upload_preset', uploadPreset);
        try {
          const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, { method: 'POST', body: formData });
          const json = await res.json();
          if (res.ok && json.secure_url) {
            status.innerText = '送信完了！ありがとうございました🎉'; status.style.color = '#2ed573';
            resultLink.href = json.secure_url; resultLink.style.display = 'inline-block';
          } else { throw new Error(json.error?.message || 'エラー'); }
        } catch (err) {
          status.innerText = `送信エラー: ${err.message}`; status.style.color = 'red'; recordBtn.style.display = 'inline-block';
        }
      };

      mediaRecorder.start(250);
      recordBtn.style.display = 'none'; stopBtn.style.display = 'inline-block';
      let timeLeft = maxTime; timerBadge.innerText = `残り ${timeLeft}秒`; timerBadge.style.display = 'block';
      countdownInterval = setInterval(() => { if (--timeLeft >= 0) timerBadge.innerText = `残り ${timeLeft}秒`; }, 1000);
      timer = setTimeout(() => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); }, maxTime * 1000);
    });

    stopBtn.addEventListener('click', () => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); });
  </script>
</body>
</html>
