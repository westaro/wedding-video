<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wedding Message Booth</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      background: #fdfaf6; 
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; touch-action: manipulation;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
    }
    
    .stage {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      width: 100%;
      height: 100%;
      padding: 16px;
    }

    /* 【上部】一番広範囲が映る 9:16 の縦長フレーム */
    .video-card {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 9 / 16; /* 9:16の比率に設定 */
      max-height: calc(100vh - 310px);
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      position: relative;
      flex-shrink: 1;
    }
    
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      transform: scaleX(-1);
    }

    #timerBadge {
      position: absolute; top: 12px; right: 12px;
      background: rgba(255, 71, 87, 0.9); color: white;
      padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 11px;
      display: none; z-index: 10;
    }

    /* 【下部】UIカードエリア */
    .bottom-ui-container {
      width: 100%;
      max-width: 380px;
      height: 240px; 
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* 90度回転（右側が上になる向き）＆ 左右反転の配置 */
    .rotated-ui-wrapper {
      width: 240px;  
      height: calc(100vw - 32px); 
      max-height: 380px; 
      transform: rotate(90deg); 
      display: flex;
      flex-direction: column; 
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 24px; 
      padding: 20px;
    }

    .text-group { 
      display: flex; 
      flex-direction: column; 
      align-items: center;
    }
    
    h2 { 
      color: #d4af37; 
      margin: 0 0 8px 0; 
      font-size: 20px; 
      font-weight: bold; 
    }
    
    p { 
      margin: 0; 
      font-size: 15px; 
      color: #555; 
      line-height: 1.6;
    }
    
    .controls-group { 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      gap: 8px;
    }

    button {
      padding: 14px 32px; font-size: 15px; border-radius: 30px;
      border: none; cursor: pointer; font-weight: bold; 
      box-shadow: 0 4px 12px rgba(229,80,57,0.3);
      white-space: nowrap;
    }
    #recordBtn { background: #e55039; color: white; }
    #stopBtn { background: #2f3542; color: white; display: none; }
    
    #status { 
      font-size: 12px; 
      font-weight: bold; 
      color: #333; 
    }
    
    #resultLink { 
      color: #007bff; 
      text-decoration: underline; 
      font-size: 12px; 
      display: block; 
    }

    .hide-during-rec { transition: opacity 0.2s; }
    .recording-mode .hide-during-rec { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  
  <div class="stage">
    <div class="video-card" id="videoCard">
      <div id="timerBadge">残り 20秒</div>
      <video id="preview" autoplay muted playsinline></video>
      <canvas id="recordCanvas" style="display:none;"></canvas>
    </div>

    <div class="bottom-ui-container" id="bottomUiContainer">
      <div class="rotated-ui-wrapper hide-during-rec" id="rotatedUiWrapper">
        <div class="text-group">
          <h2>Happy Wedding!</h2>
          <p>📱スマホを<br>横に向けて<br>撮影しよう</p>
        </div>
        
        <div class="controls-group">
          <button id="recordBtn">録画開始</button>
          <button id="stopBtn">録画ストップ</button>
          <div id="status"></div>
          <a id="resultLink" href="" target="_blank" style="display: none;">🎥 動画を確認</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const cloudName = 'wf1qutrj'; const uploadPreset = 'jr3hrfi9';
    let mediaRecorder, recordedChunks = [], cameraStream, animFrameId, timer, countdownInterval;
    const maxTime = 20, preview = document.getElementById('preview'), canvas = document.getElementById('recordCanvas'), ctx = canvas.getContext('2d');
    const recordBtn = document.getElementById('recordBtn'), stopBtn = document.getElementById('stopBtn'), status = document.getElementById('status'), timerBadge = document.getElementById('timerBadge'), resultLink = document.getElementById('resultLink'), rotatedUiWrapper = document.getElementById('rotatedUiWrapper');

    async function initCamera() {
      try {
        // 9:16の比率に合わせた解像度（1080x1920）で要求
        cameraStream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: "user", 
            width: { ideal: 1080 }, 
            height: { ideal: 1920 }, 
            frameRate: { ideal: 30 } 
          }, 
          audio: true 
        });
        preview.srcObject = cameraStream;
      } catch (e) {
        try { 
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true }); 
          preview.srcObject = cameraStream; 
        } catch (err) { 
          status.innerText = 'カメラ許可必要🙏'; 
        }
      }
    }
    initCamera();

    function drawFrame() {
      if (preview.readyState >= preview.HAVE_CURRENT_DATA) {
        let vW = preview.videoWidth, vH = preview.videoHeight;
        if (vW > 0 && vH > 0) {
          // 録画データも 9:16（720x1280）で生成
          let targetW = 720;
          let targetH = 1280;
          if (canvas.width !== targetW || canvas.height !== targetH) {
            canvas.width = targetW;
            canvas.height = targetH;
          }
          ctx.clearRect(0, 0, targetW, targetH);
          ctx.save();
          ctx.translate(targetW, 0);
          ctx.scale(-1, 1);
          
          let sRatio = vW / vH;
          let tRatio = targetW / targetH;
          let sW, sH, sX, sY;
          if (sRatio > tRatio) {
            sH = vH; sW = vH * tRatio;
            sX = (vW - sW) / 2; sY = 0;
          } else {
            sW = vW; sH = vW / tRatio;
            sX = 0; sY = (vH - sH) / 2;
          }
          ctx.drawImage(preview, sX, sY, sW, sH, 0, 0, targetW, targetH);
          ctx.restore();
        }
      }
      animFrameId = requestAnimationFrame(drawFrame);
    }

    recordBtn.addEventListener('click', () => {
      recordedChunks = []; resultLink.style.display = 'none';
      rotatedUiWrapper.classList.add('recording-mode');
      drawFrame();
      const canvasStream = canvas.captureStream(30);
      if (cameraStream.getAudioTracks().length > 0) canvasStream.addTrack(cameraStream.getAudioTracks()[0]);
      
      try { mediaRecorder = new MediaRecorder(canvasStream, { videoBitsPerSecond: 2500000 }); } 
      catch (e) { mediaRecorder = new MediaRecorder(canvasStream); }

      mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        cancelAnimationFrame(animFrameId); clearInterval(countdownInterval); clearTimeout(timer); timerBadge.style.display = 'none';
        rotatedUiWrapper.classList.remove('recording-mode');
        status.innerText = '送信中... ⏳'; recordBtn.style.display = 'none'; stopBtn.style.display = 'none';
        
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
        const formData = new FormData(); formData.append('file', blob); formData.append('upload_preset', uploadPreset);
        try {
          const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, { method: 'POST', body: formData });
          const json = await res.json();
          if (res.ok && json.secure_url) {
            status.innerText = '送信完了！🎉'; status.style.color = '#2ed573';
            resultLink.href = json.secure_url; resultLink.style.display = 'inline';
          } else { throw new Error(json.error?.message || 'エラー'); }
        } catch (err) {
          status.innerText = `エラー: ${err.message}`; status.style.color = 'red'; recordBtn.style.display = 'inline-block';
        }
      };

      mediaRecorder.start(250);
      recordBtn.style.display = 'none'; stopBtn.style.display = 'inline-block';
      let timeLeft = maxTime; timerBadge.innerText = `残り ${timeLeft}秒`; timerBadge.style.display = 'block';
      countdownInterval = setInterval(() => { if (--timeLeft >= 0) timerBadge.innerText = `残り ${timeLeft}秒`; }, 1000);
      timer = setTimeout(() => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); }, maxTime * 1000);
    });

    stopBtn.addEventListener('click', () => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); });
  </script>
</body>
</html>
