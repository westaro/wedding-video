<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wedding Message Booth</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      text-align: center; 
      background: #fdfaf6; 
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 縦長のスマホ画面（ポートレート）のまま、90度回転させて「横向き表示」を強制するコンテナ */
    .screen-rotator {
      width: 100vh;
      height: 100vw;
      transform: rotate(90deg);
      transform-origin: center center;
      position: absolute;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #fdfaf6;
      padding: 15px;
    }

    h2 { 
      color: #d4af37; 
      margin: 0 0 5px 0; 
      font-size: 20px; 
    }
    p { 
      margin: 0 0 10px 0; 
      font-size: 14px; 
      color: #555;
    }
    
    /* カメラ枠：16:9 */
    .video-container {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 16 / 9;
      max-height: calc(100vw - 120px);
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      position: relative;
      flex-shrink: 1;
    }
    
    /* 通常のカメラ映像（左右反転/自撮り表示） */
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #timerBadge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 71, 87, 0.85);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      display: none;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 10;
    }

    .controls { 
      margin-top: 12px; 
      flex-shrink: 0;
    }
    
    button { 
      padding: 12px 36px; 
      font-size: 16px; 
      border-radius: 30px; 
      border: none; 
      cursor: pointer; 
      font-weight: bold; 
      transition: 0.3s; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    
    #recordBtn { background: #e55039; color: white; }
    #recordBtn:active { background: #eb2f06; }
    #stopBtn { background: #2f3542; color: white; display: none; }
    
    #status { 
      margin-top: 8px; 
      font-weight: bold; 
      font-size: 13px; 
      min-height: 18px; 
      word-break: break-all; 
    }
    
    #resultLink { 
      display: block; 
      margin-top: 6px; 
      color: #007bff; 
      text-decoration: underline; 
      font-weight: bold; 
      font-size: 13px;
    }

    /* 撮影中に文字や案内を隠すクラス */
    .recording-mode .hide-during-rec {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="screen-rotator" id="screenRotator">
    <div class="hide-during-rec">
      <h2>Happy Wedding!</h2>
      <p>📱 横向きで撮影してください</p>
    </div>
    
    <div class="video-container" id="videoContainer">
      <div id="timerBadge">残り 20秒</div>
      <video id="preview" autoplay muted playsinline></video>
      <canvas id="recordCanvas" style="display:none;"></canvas>
    </div>
    
    <div class="controls">
      <button id="recordBtn">録画開始</button>
      <button id="stopBtn">録画ストップ</button>
    </div>
    <div id="status" class="hide-during-rec"></div>
    <a id="resultLink" href="" target="_blank" style="display: none;" class="hide-during-rec">🎥 保存された動画を確認する</a>
  </div>

  <script>
    const cloudName = 'wf1qutrj'; 
    const uploadPreset = 'jr3hrfi9'; 

    let mediaRecorder;
    let recordedChunks = [];
    let cameraStream;
    let recordStream;
    let animFrameId;
    let maxTime = 20;
    let timeLeft = maxTime;
    let timer;
    let countdownInterval;

    const preview = document.getElementById('preview');
    const canvas = document.getElementById('recordCanvas');
    const ctx = canvas.getContext('2d');
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');
    const timerBadge = document.getElementById('timerBadge');
    const resultLink = document.getElementById('resultLink');
    const screenRotator = document.getElementById('screenRotator');

    function getSupportedMimeType() {
      const types = [
        'video/webm;codecs=vp8,opus',
        'video/webm',
        'video/mp4'
      ];
      for (const t of types) {
        if (MediaRecorder.isTypeSupported(t)) return t;
      }
      return '';
    }

    async function initCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 30 }
          }, 
          audio: true 
        });

        preview.srcObject = cameraStream;
      } catch (err) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "user" }, 
            audio: true 
          });
          preview.srcObject = cameraStream;
        } catch (e) {
          status.innerText = 'カメラとマイクのアクセスを許可してください🙏';
          status.style.color = 'red';
        }
      }
    }

    initCamera();

    /* キャンバスへ描画（変に角度変更・回転処理はせず、ありのまま描画） */
    function drawFrame() {
      if (preview.readyState >= preview.HAVE_CURRENT_DATA) {
        let vWidth = preview.videoWidth;
        let vHeight = preview.videoHeight;

        if (vWidth > 0 && vHeight > 0) {
          let targetWidth = 1280;
          let targetHeight = 720;

          if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
            canvas.width = targetWidth;
            canvas.height = targetHeight;
          }

          ctx.clearRect(0, 0, targetWidth, targetHeight);
          ctx.save();
          
          // 鏡撮影（インカメラ用左右反転）のみ適用
          ctx.translate(targetWidth, 0);
          ctx.scale(-1, 1);

          let vRatio = vWidth / vHeight;
          let tRatio = targetWidth / targetHeight;
          let sWidth, sHeight, sX, sY;

          if (vRatio > tRatio) {
            sHeight = vHeight;
            sWidth = vHeight * tRatio;
            sX = (vWidth - sWidth) / 2;
            sY = 0;
          } else {
            sWidth = vWidth;
            sHeight = vWidth / tRatio;
            sX = 0;
            sY = (vHeight - sHeight) / 2;
          }

          ctx.drawImage(preview, sX, sY, sWidth, sHeight, 0, 0, targetWidth, targetHeight);
          ctx.restore();
        }
      }
      animFrameId = requestAnimationFrame(drawFrame);
    }

    recordBtn.addEventListener('click', () => {
      recordedChunks = [];
      resultLink.style.display = 'none';

      screenRotator.classList.add('recording-mode');

      drawFrame();
      const canvasStream = canvas.captureStream(30);

      const audioTracks = cameraStream.getAudioTracks();
      if (audioTracks.length > 0) {
        canvasStream.addTrack(audioTracks[0]);
      }
      recordStream = canvasStream;

      const mimeType = getSupportedMimeType();
      const options = { videoBitsPerSecond: 2500000 };
      if (mimeType) { options.mimeType = mimeType; }

      try {
        mediaRecorder = new MediaRecorder(recordStream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(recordStream);
      }

      mediaRecorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = async () => {
        cancelAnimationFrame(animFrameId);
        clearInterval(countdownInterval);
        clearTimeout(timer);
        timerBadge.style.display = 'none';

        screenRotator.classList.remove('recording-mode');

        status.innerText = '送信中... ⏳';
        status.style.color = '#333';
        recordBtn.style.display = 'none';
        stopBtn.style.display = 'none';

        const actualType = mediaRecorder.mimeType || mimeType || 'video/webm';
        const blob = new Blob(recordedChunks, { type: actualType });

        if (blob.size === 0) {
          status.innerText = 'エラー: 録画データが空です。もう一度お試しください。';
          status.style.color = 'red';
          recordBtn.style.display = 'inline-block';
          return;
        }

        const formData = new FormData();
        formData.append('file', blob);
        formData.append('upload_preset', uploadPreset);

        try {
          const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, {
            method: 'POST',
            body: formData
          });

          const result = await response.json();
          if (response.ok && result.secure_url) {
            status.innerText = '送信完了！ありがとうございました🎉';
            status.style.color = '#2ed573';
            
            resultLink.href = result.secure_url;
            resultLink.style.display = 'block';
          } else {
            console.error('Cloudinary Error Details:', result);
            const errorMsg = result.error && result.error.message ? result.error.message : '不明なサーバーエラー';
            throw new Error(errorMsg);
          }
        } catch (error) {
          console.error('Upload Catch Error:', error);
          status.innerText = `送信エラー: ${error.message}`;
          status.style.color = 'red';
          recordBtn.style.display = 'inline-block';
        }
      };

      mediaRecorder.start(1000);
      recordBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';

      timeLeft = maxTime;
      timerBadge.innerText = `残り ${timeLeft}秒`;
      timerBadge.style.display = 'block';

      countdownInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft >= 0) {
          timerBadge.innerText = `残り ${timeLeft}秒`;
        }
      }, 1000);

      timer = setTimeout(() => {
        if (mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }
      }, maxTime * 1000);
    });

    stopBtn.addEventListener('click', () => {
      if (mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    });
  </script>
</body>
</html>
