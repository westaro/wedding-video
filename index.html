<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Message Booth</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #000; font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }

        /* カメラ映像 (背景に全画面表示・広角) */
        #camera-video {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover; /* 画面いっぱいに広く表示 */
            z-index: 1;
        }

        /* UIを重ねるレイヤー */
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10;
            pointer-events: none; /* ボタン以外のクリックを透過 */
        }

        /* 
         【重要】スマホを時計回りに90度倒した時に読めるようにする設定。
         縦持ちの時はUI全体を反時計回りに90度回転させておきます。
        */
        @media screen and (orientation: portrait) {
            .rotate-ui {
                transform: rotate(-90deg);
                width: 100vh;
                height: 100vw;
                position: absolute;
                top: 50%;
                left: 50%;
                margin-top: -50vw;
                margin-left: -50vh;
            }
        }
        /* ユーザーがスマホを横持ちにしたら回転を解除して全画面にフィット */
        @media screen and (orientation: landscape) {
            .rotate-ui {
                width: 100vw;
                height: 100vh;
                position: absolute;
                top: 0;
                left: 0;
            }
        }

        /* UIコンテナ共通 */
        .ui-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%; height: 100%;
            pointer-events: auto; /* クリックを有効化 */
            position: relative;
        }

        /* === 待機画面 === */
        #ready-ui {
            display: flex;
        }
        #ready-screen {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        #ready-screen h2 { color: #d4af37; font-size: 28px; margin-bottom: 15px; font-family: serif; }
        #ready-screen p { color: #333; font-size: 16px; margin-bottom: 25px; line-height: 1.5; font-weight: bold; }
        .attention { color: #ef5350; }

        #start-btn {
            background-color: #ef5350; color: white;
            border: none; padding: 15px 40px; font-size: 22px; font-weight: bold;
            border-radius: 30px; box-shadow: 0 5px 15px rgba(239, 83, 80, 0.4);
            cursor: pointer;
        }

        /* === 録画中画面 === */
        #recording-ui {
            display: none; /* 初期は非表示 */
        }
        #countdown {
            position: absolute;
            top: 20px;
            background: rgba(239, 83, 80, 0.9);
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        /* 録画停止ボタン (右端) */
        #stop-btn {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            background-color: white;
            color: #ef5350;
            border: none;
            width: 80px; height: 80px;
            border-radius: 50%;
            font-size: 18px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        /* === ステータス画面 === */
        #status-view {
            display: none;
            background: rgba(255,255,255,0.95);
            z-index: 100;
        }
        #status-text {
            font-size: 22px; font-weight: bold; color: #333; text-align: center; line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- カメラ映像 (プレビューと録画を兼用) -->
    <video id="camera-video" autoplay muted playsinline></video>

    <!-- UIレイヤー -->
    <div id="ui-layer">
        <div class="rotate-ui">
            
            <!-- 待機画面 -->
            <div id="ready-ui" class="ui-content">
                <div id="ready-screen">
                    <h2>Happy Wedding!</h2>
                    <!-- 映像が横倒しになるのを防ぐため、画面ロック解除を促します -->
                    <p>綺麗に撮影するために<br>スマホの<span class="attention">「画面回転ロック」を解除</span>して<br>横向きに持ち替えてください</p>
                    <button id="start-btn">録画開始</button>
                </div>
            </div>

            <!-- 録画中画面 -->
            <div id="recording-ui" class="ui-content">
                <div id="countdown">残り 20 秒</div>
                <button id="stop-btn">停止</button>
            </div>

            <!-- ステータス画面 (アップロード中/完了) -->
            <div id="status-view" class="ui-content">
                <p id="status-text">準備中...</p>
            </div>

        </div>
    </div>

    <script>
        // --- 設定エリア ---
        const CLOUD_NAME = 'wf1qutrj'; 
        const UPLOAD_PRESET = 'wedding_preset'; // ご自身で作成したプリセット名
        const MAX_SECONDS = 20; // 20秒

        let mediaRecorder;
        let recordedChunks = [];
        let stream;
        let timerInterval;

        // ページ読み込み時にカメラを起動
        window.onload = async () => {
            try {
                // 広角で自然に映るようにアスペクト比の強制を解除しました
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' },
                    audio: true
                });
                document.getElementById('camera-video').srcObject = stream;
            } catch (err) {
                alert('カメラとマイクのアクセスを許可してください。');
                console.error(err);
            }
        };

        // 録画開始ボタンの処理
        document.getElementById('start-btn').addEventListener('click', () => {
            if (!stream) return alert('カメラが準備できていません');

            // UIの切り替え
            document.getElementById('ready-ui').style.display = 'none';
            document.getElementById('recording-ui').style.display = 'flex';

            recordedChunks = [];
            
            let options = { mimeType: 'video/mp4' };
            if (!MediaRecorder.isTypeSupported('video/mp4')) {
                options = { mimeType: 'video/webm' };
            }

            mediaRecorder = new MediaRecorder(stream, options);

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = uploadToCloudinary;
            mediaRecorder.start();

            // 20秒のカウントダウンと自動停止
            let timeLeft = MAX_SECONDS;
            document.getElementById('countdown').innerText = `残り ${timeLeft} 秒`;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('countdown').innerText = `残り ${timeLeft} 秒`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (mediaRecorder.state === 'recording') mediaRecorder.stop();
                }
            }, 1000);
        });

        // 録画停止ボタンの処理
        document.getElementById('stop-btn').addEventListener('click', () => {
            clearInterval(timerInterval);
            if (mediaRecorder.state === 'recording') mediaRecorder.stop();
        });

        // Cloudinaryへのアップロード処理
        async function uploadToCloudinary() {
            // UIをアップロード中に切り替え
            document.getElementById('recording-ui').style.display = 'none';
            const statusView = document.getElementById('status-view');
            statusView.style.display = 'flex';
            document.getElementById('status-text').innerText = '動画を保存しています...\n少々お待ちください';

            const blob = new Blob(recordedChunks, { type: recordedChunks[0].type });
            const formData = new FormData();
            formData.append('file', blob);
            formData.append('upload_preset', UPLOAD_PRESET); 

            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.secure_url) {
                    document.getElementById('status-text').innerHTML = '✨ 撮影完了！ ✨<br>メッセージありがとうございました。<br><br><span style="font-size:16px; color:#666;">画面を閉じて終了してください</span>';
                } else {
                    throw new Error('Upload failed');
                }
            } catch (err) {
                console.error(err);
                document.getElementById('status-text').innerHTML = 'エラーが発生しました。<br>通信環境の良い場所で再試行してください。';
            }
        }
    </script>
</body>
</html>
