<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホでの表示最適化 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wedding Message Booth</title>
  <style>
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      text-align: center; 
      background: #fdfaf6; 
      padding: 15px; 
      color: #333; 
    }
    h2 { color: #d4af37; margin-bottom: 5px; margin-top: 10px; }
    p { margin-bottom: 15px; font-size: 14px; }
    
    /* 9:16 の縦長枠 */
    .video-container {
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
      aspect-ratio: 9 / 16;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      position: relative;
    }
    
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #timerBadge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 71, 87, 0.85);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      display: none;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .controls { margin-top: 20px; }
    button { 
      padding: 15px 40px; 
      font-size: 18px; 
      border-radius: 30px; 
      border: none; 
      cursor: pointer; 
      font-weight: bold; 
      transition: 0.3s; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #recordBtn { background: #e55039; color: white; }
    #recordBtn:active { background: #eb2f06; }
    #stopBtn { background: #2f3542; color: white; display: none; }
    #status { margin-top: 15px; font-weight: bold; font-size: 15px; min-height: 24px; }
  </style>
</head>
<body>
  <h2>Happy Wedding!</h2>
  <p>お祝いメッセージをお願いします🎥（最大20秒）</p>
  
  <div class="video-container">
    <div id="timerBadge">残り 20秒</div>
    <video id="preview" autoplay muted playsinline></video>
  </div>
  
  <div class="controls">
    <button id="recordBtn">録画開始</button>
    <button id="stopBtn">録画ストップ</button>
  </div>
  <div id="status"></div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbw9oglBwZb9rC8LcyXmT0yppsie8PcNaFPitNDMKIDm4nK0PQ-8E3jPXk2dIwfY9hZ1-w/exec';
    
    let mediaRecorder;
    let recordedChunks = [];
    let stream;
    let maxTime = 20;
    let timeLeft = maxTime;
    let timer;
    let countdownInterval;

    const preview = document.getElementById('preview');
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');
    const timerBadge = document.getElementById('timerBadge');

    async function initCamera() {
      try {
        // 解像度を適正サイズ（720p）に指定して軽量化
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: "user",
            width: { ideal: 720 },
            height: { ideal: 1280 }
          }, 
          audio: true 
        });

        const videoTrack = stream.getVideoTracks()[0];
        if (videoTrack && typeof videoTrack.getCapabilities === 'function') {
          const capabilities = videoTrack.getCapabilities();
          if (capabilities.zoom) {
            await videoTrack.applyConstraints({
              advanced: [{ zoom: capabilities.zoom.min }]
            });
          }
        }

        preview.srcObject = stream;
      } catch (err) {
        status.innerText = 'カメラとマイクのアクセスを許可してください🙏';
        status.style.color = 'red';
      }
    }

    initCamera();

    recordBtn.addEventListener('click', () => {
      recordedChunks = [];
      
      let mimeType = 'video/webm';
      if (!MediaRecorder.isTypeSupported('video/webm')) {
        mimeType = 'video/mp4';
      }

      // ビットレートを1.2Mbpsに制限して、20秒で約3MB程度に収める設定を追加
      const options = {
        mimeType: mimeType,
        videoBitsPerSecond: 1200000 
      };

      mediaRecorder = new MediaRecorder(stream, options);

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        clearInterval(countdownInterval);
        clearTimeout(timer);
        timerBadge.style.display = 'none';

        status.innerText = 'Googleドライブに送信中... ⏳';
        status.style.color = '#333';
        recordBtn.style.display = 'none';
        stopBtn.style.display = 'none';

        const blob = new Blob(recordedChunks, { type: mimeType });
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        
        reader.onloadend = async () => {
          const base64data = reader.result.split(',')[1];
          const extension = mimeType.includes('mp4') ? 'mp4' : 'webm';
          const filename = `guest_message_${Date.now()}.${extension}`;

          try {
            const response = await fetch(scriptURL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                filename: filename,
                mimeType: mimeType,
                base64: base64data
              })
            });
            
            const result = await response.json();
            if(result.status === "success") {
              status.innerText = '送信完了！ありがとうございました🎉';
              status.style.color = '#2ed573';
            } else {
              throw new Error(result.message);
            }
          } catch (error) {
            console.error(error);
            status.innerText = '送信処理を行いました（保存確認をしてください）';
          }
        };
      };

      mediaRecorder.start();
      recordBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';

      timeLeft = maxTime;
      timerBadge.innerText = `残り ${timeLeft}秒`;
      timerBadge.style.display = 'block';
      status.innerText = `🔴 録画中... (残り ${timeLeft}秒)`;
      status.style.color = '#ff4757';

      countdownInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft >= 0) {
          timerBadge.innerText = `残り ${timeLeft}秒`;
          status.innerText = `🔴 録画中... (残り ${timeLeft}秒)`;
        }
      }, 1000);

      timer = setTimeout(() => {
        if (mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }
      }, maxTime * 1000);
    });

    stopBtn.addEventListener('click', () => {
      if (mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    });
  </script>
</body>
</html>
