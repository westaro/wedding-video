<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホアプリのように見せるための設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Wedding Message Booth</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #fcf9f9; 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            /* スクロールを禁止し、iOSのタブ領域を含めた正確な高さを確保 */
            height: 100dvh; 
            width: 100vw;
            overflow: hidden; 
            touch-action: none; 
            color: #333;
        }

        /* アプリ全体のコンテナ */
        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #check-ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(252, 249, 249, 0.95);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #check-screen {
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        #check-screen h2 { font-size: 22px; margin-bottom: 15px; color: #333; }
        #check-screen p { font-size: 15px; margin-bottom: 20px; line-height: 1.6; font-weight: bold; }
        
        .checkbox-label {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; font-size: 15px; font-weight: bold; color: #333;
            background: #f5f5f5; padding: 15px; border-radius: 10px;
            margin-bottom: 25px; cursor: pointer;
        }
        .checkbox-label input { width: 22px; height: 22px; flex-shrink: 0; }

        .primary-btn {
            background-color: #ef5350; color: white; border: none;
            padding: 15px 40px; font-size: 18px; font-weight: bold;
            border-radius: 30px; cursor: pointer; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(239, 83, 80, 0.4);
            width: 80%; max-width: 250px;
        }
        .primary-btn:disabled {
            background-color: #ccc; cursor: not-allowed; box-shadow: none;
        }
        
        .stop-btn {
            background-color: white; color: #ef5350; border: 2px solid #ef5350;
            padding: 15px 40px; font-size: 18px; font-weight: bold;
            border-radius: 30px; cursor: pointer; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 80%; max-width: 250px;
        }

        #main-ui {
            display: none; /* 初期は非表示 */
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            width: 100%;
            height: 100%;
            padding: 20px 10px;
        }
        
        #main-title {
            color: #d4af37; font-size: 32px; font-family: serif; font-weight: bold;
            text-align: center;
        }

        /* 
         映像を9:16に保ちつつ、Safariのタブに被らないよう高さを制限するコンテナ
        */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 300px; /* スマホ画面での最大幅 */
            aspect-ratio: 9 / 16; /* 縦長(9:16)を維持 */
            max-height: 55dvh; /* 画面の高さの55%を上限とし、上下に余白を作る */
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background-color: #222;
            margin: 10px 0;
        }
        
        #camera-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 鏡のように左右反転させて表示 (保存データは反転しません) */
            transform: scaleX(-1);
        }

        /* カウントダウンバッジ (映像の上に重なる) */
        #countdown-badge {
            display: none;
            position: absolute;
            top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(239, 83, 80, 0.95); color: white;
            padding: 8px 20px; border-radius: 20px;
            font-size: 20px; font-weight: bold; z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #status-ui {
            display: none;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); z-index: 100;
            flex-direction: column; justify-content: center; align-items: center;
        }
        #status-text { font-size: 20px; font-weight: bold; color: #333; text-align: center; line-height: 1.8; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="app-container">
        
        <div id="check-ui">
            <div id="check-screen">
                <h2>事前準備のお願い</h2>
                <p>スマホは<span style="color: #ef5350;">「縦向き」</span>のまま<br>撮影を行います。</p>
                <label class="checkbox-label">
                    <input type="checkbox" id="ready-check">
                    準備OK
                </label>
                <button id="next-btn" class="primary-btn" disabled>次へ進む</button>
            </div>
        </div>

        <div id="main-ui">
            <h2 id="main-title">Happy Wedding!</h2>
            
            <!-- 映像プレビュー (9:16) -->
            <div class="video-wrapper">
                <div id="countdown-badge">残り 20 秒</div>
                <video id="camera-video" autoplay muted playsinline></video>
            </div>
            
            <!-- 操作ボタン -->
            <button id="start-btn" class="primary-btn">録画開始</button>
            <button id="stop-btn" class="stop-btn hidden">停止</button>
        </div>

        <div id="status-ui">
            <p id="status-text">準備中...</p>
        </div>

    </div>

    <script>
        const CLOUD_NAME = 'wf1qutrj'; 
        const UPLOAD_PRESET = 'wedding_preset';
        const MAX_SECONDS = 20;

        let mediaRecorder;
        let recordedChunks = [];
        let stream;
        let timerInterval;

        // ページ読み込み時にカメラを起動
        window.onload = async () => {
            try {
                // 9:16の比率を優先してカメラを取得
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', aspectRatio: 9 / 16 },
                    audio: true
                });
                document.getElementById('camera-video').srcObject = stream;
            } catch (err) {
                alert('カメラとマイクのアクセスを許可してください。');
                console.error(err);
            }
        };

        document.getElementById('ready-check').addEventListener('change', (e) => {
            const btn = document.getElementById('next-btn');
            btn.disabled = !e.target.checked;
        });

        // 「次へ進む」ボタン
        document.getElementById('next-btn').addEventListener('click', () => {
            document.getElementById('check-ui').style.display = 'none';
            document.getElementById('main-ui').style.display = 'flex';
        });

        // 録画開始ボタン
        document.getElementById('start-btn').addEventListener('click', () => {
            if (!stream) return alert('カメラが準備できていません');

            // UIの切り替え
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('stop-btn').classList.remove('hidden');
            document.getElementById('countdown-badge').style.display = 'block';

            recordedChunks = [];
            
            let options = { mimeType: 'video/mp4' };
            if (!MediaRecorder.isTypeSupported('video/mp4')) {
                options = { mimeType: 'video/webm' };
            }

            mediaRecorder = new MediaRecorder(stream, options);

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = uploadToCloudinary;
            mediaRecorder.start();

            // カウントダウン処理
            let timeLeft = MAX_SECONDS;
            document.getElementById('countdown-badge').innerText = `残り ${timeLeft} 秒`;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('countdown-badge').innerText = `残り ${timeLeft} 秒`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (mediaRecorder.state === 'recording') mediaRecorder.stop();
                }
            }, 1000);
        });

        // 録画停止ボタン
        document.getElementById('stop-btn').addEventListener('click', () => {
            clearInterval(timerInterval);
            if (mediaRecorder.state === 'recording') mediaRecorder.stop();
        });

        async function uploadToCloudinary() {
            // UIをアップロード中に切り替え
            document.getElementById('main-ui').style.display = 'none';
            const statusUi = document.getElementById('status-ui');
            statusUi.style.display = 'flex';
            document.getElementById('status-text').innerText = '動画を保存しています...\n少々お待ちください';

            const blob = new Blob(recordedChunks, { type: recordedChunks[0].type });
            const formData = new FormData();
            formData.append('file', blob);
            formData.append('upload_preset', UPLOAD_PRESET); 

            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.secure_url) {
                    document.getElementById('status-text').innerHTML = '✨ 撮影完了！ ✨<br><br>メッセージありがとうございました。<br><br><span style="font-size:14px; color:#666; font-weight:normal;">この画面を閉じて終了してください</span>';
                } else {
                    throw new Error('Upload failed');
                }
            } catch (err) {
                console.error(err);
                document.getElementById('status-text').innerHTML = 'エラーが発生しました。<br>通信環境の良い場所で再試行してください。';
            }
        }
    </script>
</body>
</html>
