<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wedding Message Booth - Landscape</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      background: #fdfaf6; 
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; touch-action: manipulation;
      display: flex; flex-direction: row;
      justify-content: space-between; align-items: center;
      padding: 15px 25px;
    }
    
    /* 左側：テキストと操作ボタンを横並びで配置（スマホを横に向けたときに自然に読める） */
    .left-panel {
      display: flex; flex-direction: column;
      justify-content: center; align-items: flex-start;
      gap: 15px; width: 28%; height: 100%;
      text-align: left;
    }
    h2 { color: #d4af37; margin: 0; font-size: 22px; line-height: 1.2; }
    p { margin: 0; font-size: 13px; color: #555; line-height: 1.4; }
    
    .controls { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    button {
      padding: 12px 20px; font-size: 15px; border-radius: 30px;
      border: none; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%; text-align: center;
    }
    #recordBtn { background: #e55039; color: white; }
    #stopBtn { background: #2f3542; color: white; display: none; }
    #status { font-weight: bold; font-size: 12px; min-height: 16px; color: #333; }
    #resultLink { color: #007bff; text-decoration: underline; font-size: 12px; word-break: break-all; }

    /* 右側：大人数でもしっかり映る完全な横長（16:9）のカメラ映像エリア */
    .video-container {
      width: 68%;
      height: 100%;
      max-height: 85vh;
      aspect-ratio: 16 / 9; /* 大人数が横並びで映る16:9の横長比率を厳守 */
      border-radius: 16px; overflow: hidden;
      background: #000; box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      position: relative;
      margin: auto 0;
    }
    
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; /* 黒帯なしで画面いっぱいに表示 */
      transform: scaleX(-1); /* フロントカメラの左右反転 */
    }

    #timerBadge {
      position: absolute; top: 15px; right: 15px;
      background: rgba(255, 71, 87, 0.85); color: white;
      padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px;
      display: none; z-index: 10;
    }
    
    .recording-mode .hide-during-rec { display: none !important; }
  </style>
</head>
<body>
  
  <div class="left-panel hide-during-rec" id="leftPanel">
    <div>
      <h2>Happy Wedding!</h2>
      <p>📱 スマホを横に向けて、大勢で並んで撮影してくださいね！</p>
    </div>
    
    <div class="controls">
      <button id="recordBtn">録画開始</button>
      <button id="stopBtn">録画ストップ</button>
    </div>
    
    <div>
      <div id="status"></div>
      <a id="resultLink" href="" target="_blank" style="display: none;">🎥 保存された動画を確認する</a>
    </div>
  </div>
  
  <div class="video-container" id="videoContainer">
    <div id="timerBadge">残り 20秒</div>
    <video id="preview" autoplay muted playsinline></video>
    <canvas id="recordCanvas" style="display:none;"></canvas>
  </div>

  <script>
    const cloudName = 'wf1qutrj'; const uploadPreset = 'jr3hrfi9';
    let mediaRecorder, recordedChunks = [], cameraStream, animFrameId, timer, countdownInterval;
    const maxTime = 20, preview = document.getElementById('preview'), canvas = document.getElementById('recordCanvas'), ctx = canvas.getContext('2d');
    const recordBtn = document.getElementById('recordBtn'), stopBtn = document.getElementById('stopBtn'), status = document.getElementById('status'), timerBadge = document.getElementById('timerBadge'), resultLink = document.getElementById('resultLink'), videoContainer = document.getElementById('videoContainer'), leftPanel = document.getElementById('leftPanel');

    async function initCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, 
          audio: true 
        });
        preview.srcObject = cameraStream;
      } catch (e) {
        try { 
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true }); 
          preview.srcObject = cameraStream; 
        } catch (err) { 
          status.innerText = 'カメラとマイクの許可が必要です🙏'; 
        }
      }
    }
    initCamera();

    function drawFrame() {
      if (preview.readyState >= preview.HAVE_CURRENT_DATA) {
        let vW = preview.videoWidth, vH = preview.videoHeight;
        if (vW > 0 && vH > 0) {
          let targetW = 1280;
          let targetH = 720; // 16:9の横長解像度で録画データを作成
          if (canvas.width !== targetW || canvas.height !== targetH) {
            canvas.width = targetW;
            canvas.height = targetH;
          }
          ctx.clearRect(0, 0, targetW, targetH);
          ctx.save();
          ctx.translate(targetW, 0);
          ctx.scale(-1, 1); // 左右反転
          
          let sRatio = vW / vH;
          let tRatio = targetW / targetH;
          let sW, sH, sX, sY;
          if (sRatio > tRatio) {
            sH = vH; sW = vH * tRatio;
            sX = (vW - sW) / 2; sY = 0;
          } else {
            sW = vW; sH = vW / tRatio;
            sX = 0; sY = (vH - sH) / 2;
          }
          ctx.drawImage(preview, sX, sY, sW, sH, 0, 0, targetW, targetH);
          ctx.restore();
        }
      }
      animFrameId = requestAnimationFrame(drawFrame);
    }

    recordBtn.addEventListener('click', () => {
      recordedChunks = []; resultLink.style.display = 'none';
      videoContainer.classList.add('recording-mode');
      leftPanel.classList.add('recording-mode');
      drawFrame();
      const canvasStream = canvas.captureStream(30);
      if (cameraStream.getAudioTracks().length > 0) canvasStream.addTrack(cameraStream.getAudioTracks()[0]);
      
      try { mediaRecorder = new MediaRecorder(canvasStream, { videoBitsPerSecond: 2000000 }); } 
      catch (e) { mediaRecorder = new MediaRecorder(canvasStream); }

      mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        cancelAnimationFrame(animFrameId); clearInterval(countdownInterval); clearTimeout(timer); timerBadge.style.display = 'none';
        videoContainer.classList.remove('recording-mode');
        leftPanel.classList.remove('recording-mode');
        status.innerText = '送信中... ⏳'; recordBtn.style.display = 'none'; stopBtn.style.display = 'none';
        
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
        const formData = new FormData(); formData.append('file', blob); formData.append('upload_preset', uploadPreset);
        try {
          const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, { method: 'POST', body: formData });
          const json = await res.json();
          if (res.ok && json.secure_url) {
            status.innerText = '送信完了！ありがとうございました🎉'; status.style.color = '#2ed573';
            resultLink.href = json.secure_url; resultLink.style.display = 'block';
          } else { throw new Error(json.error?.message || 'エラー'); }
        } catch (err) {
          status.innerText = `送信エラー: ${err.message}`; status.style.color = 'red'; recordBtn.style.display = 'block';
        }
      };

      mediaRecorder.start(250);
      recordBtn.style.display = 'none'; stopBtn.style.display = 'block';
      let timeLeft = maxTime; timerBadge.innerText = `残り ${timeLeft}秒`; timerBadge.style.display = 'block';
      countdownInterval = setInterval(() => { if (--timeLeft >= 0) timerBadge.innerText = `残り ${timeLeft}秒`; }, 1000);
      timer = setTimeout(() => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); }, maxTime * 1000);
    });

    stopBtn.addEventListener('click', () => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); });
  </script>
</body>
</html>
