<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4:3 Video Recorder</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background: #f0f0f0;
    }
    .video-container {
      width: 640px;
      height: 480px; /* 4:3のアスペクト比 */
      background: #000;
      margin-bottom: 15px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>4:3 動画撮影・保存（フレーム停止対策版）</h1>

  <div class="video-container">
    <video id="preview" autoplay playsinline muted></video>
  </div>

  <div class="controls">
    <button id="startBtn">撮影開始</button>
    <button id="stopBtn" disabled>撮影停止</button>
  </div>

  <h3>録画結果 (4:3)</h3>
  <div class="video-container">
    <video id="recorded" controls></video>
  </div>

  <script>
    const preview = document.getElementById('preview');
    const recorded = document.getElementById('recorded');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    let mediaRecorder;
    let recordedChunks = [];
    let stream;

    // 1. 4:3の解像度指定でカメラを初期化
    async function initCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 },
            aspectRatio: { exact: 4 / 3 }, // 4:3を明示的に指定
            frameRate: { ideal: 30 }
          },
          audio: true
        });
        preview.srcObject = stream;
      } catch (err) {
        console.error("カメラの読み込みエラー:", err);
      }
    }

    // 2. 録画処理（カクつき・停止対策）
    startBtn.addEventListener('click', () => {
      recordedChunks = [];
      
      // サポートされている適切なMIMEタイプを選択（ビットレート低下によるフレームフリーズを防止）
      const options = {
        mimeTypes: 'video/webm;codecs=vp9,opus',
        videoBitsPerSecond: 2500000 // 2.5 Mbps で安定化
      };

      try {
        mediaRecorder = new MediaRecorder(stream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      // 100msごとにデータを小さく分割してバッファに送ることで後半のフリーズを防止
      mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        recorded.src = URL.createObjectURL(blob);
      };

      // 100msのタイムスライスを指定
      mediaRecorder.start(100);

      startBtn.disabled = true;
      stopBtn.disabled = false;
    });

    stopBtn.addEventListener('click', () => {
      mediaRecorder.stop();
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    initCamera();
  </script>
</body>
</html>
