<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホでの表示最適化 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wedding Message Booth</title>
  <style>
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      text-align: center; 
      background: #fdfaf6; 
      padding: 15px; 
      color: #333; 
    }
    h2 { color: #d4af37; margin-bottom: 5px; margin-top: 10px; }
    p { margin-bottom: 15px; font-size: 14px; }
    
    /* 画面枠は9:16比率で固定 */
    .video-container {
      width: 100%;
      max-width: 320px; /* スマホ画面で収まりやすい幅 */
      margin: 0 auto;
      aspect-ratio: 9 / 16; /* 9:16の枠線 */
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    video {
      width: 100%;
      height: 100%;
      /* object-fit: contain に変更し、カメラ映像をトリミング（アップ）させず全体を表示 */
      object-fit: contain; 
    }

    .controls { margin-top: 20px; }
    button { 
      padding: 15px 40px; 
      font-size: 18px; 
      border-radius: 30px; 
      border: none; 
      cursor: pointer; 
      font-weight: bold; 
      transition: 0.3s; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #recordBtn { background: #ff4757; color: white; }
    #recordBtn:active { background: #ff6b81; }
    #stopBtn { background: #2f3542; color: white; display: none; }
    #status { margin-top: 15px; font-weight: bold; font-size: 15px; min-height: 24px; }
  </style>
</head>
<body>
  <h2>Happy Wedding!</h2>
  <p>お祝いメッセージをお願いします🎥（最大20秒）</p>
  
  <!-- 9:16の枠 -->
  <div class="video-container">
    <video id="preview" autoplay muted playsinline></video>
  </div>
  
  <div class="controls">
    <button id="recordBtn">撮影スタート</button>
    <button id="stopBtn">撮影ストップ</button>
  </div>
  <div id="status"></div>

  <script>
    // GASのウェブアプリURL
    const scriptURL = 'https://script.google.com/macros/s/AKfycbw9oglBwZb9rC8LcyXmT0yppsie8PcNaFPitNDMKIDm4nK0PQ-8E3jPXk2dIwfY9hZ1-w/exec';
    
    let mediaRecorder;
    let recordedChunks = [];
    let stream;
    let maxTime = 20000; // 20秒（ミリ秒）
    let timer;

    const preview = document.getElementById('preview');
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');

    // カメラの初期化（一番最初のシンプルな設定に戻し、広角で全体を取得）
    async function initCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user" }, // 倍率変更やクロップを行わない一番最初の標準設定
          audio: true 
        });
        preview.srcObject = stream;
      } catch (err) {
        status.innerText = 'カメラとマイクのアクセスを許可してください🙏';
        status.style.color = 'red';
      }
    }

    initCamera();

    // 撮影スタート
    recordBtn.addEventListener('click', () => {
      recordedChunks = [];
      
      // iOSとAndroidでサポートされている形式を判定
      let options = { mimeType: 'video/webm' };
      if (!MediaRecorder.isTypeSupported('video/webm')) {
        options = { mimeType: 'video/mp4' };
      }

      mediaRecorder = new MediaRecorder(stream, options);

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        status.innerText = 'Googleドライブに送信中... ⏳';
        status.style.color = '#333';
        recordBtn.style.display = 'none';
        stopBtn.style.display = 'none';

        // 動画データをBlob化してBase64に変換
        const blob = new Blob(recordedChunks, { type: options.mimeType });
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        
        reader.onloadend = async () => {
          const base64data = reader.result.split(',')[1];
          const extension = options.mimeType.includes('mp4') ? 'mp4' : 'webm';
          const filename = `guest_message_${Date.now()}.${extension}`;

          try {
            // GASへPOST送信
            const response = await fetch(scriptURL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                filename: filename,
                mimeType: options.mimeType,
                base64: base64data
              })
            });
            
            const result = await response.json();
            if(result.status === "success") {
              status.innerText = '送信完了！ありがとうございました🎉';
              status.style.color = '#2ed573';
            } else {
              throw new Error(result.message);
            }
          } catch (error) {
            console.error(error);
            status.innerText = '送信処理を行いました（エラーが続く場合は新郎新婦へお知らせください）';
          }
        };
      };

      // 録画開始
      mediaRecorder.start();
      recordBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';
      status.innerText = '🔴 録画中... (最大20秒)';
      status.style.color = '#ff4757';

      // 20秒で強制的にストップ
      timer = setTimeout(() => {
        if (mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }
      }, maxTime);
    });

    // 途中で撮影ストップ
    stopBtn.addEventListener('click', () => {
      if (mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        clearTimeout(timer);
      }
    });
  </script>
</body>
</html>
