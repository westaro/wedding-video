<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wedding Message Booth - Split Layout</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      background: #fdfaf6; 
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; touch-action: manipulation;
      display: flex; flex-direction: column;
    }
    
    /* 【上部 1/4エリア】テキストと録画ボタン：横向きで読めるよう90度回転させるコンテナ */
    .rotated-header-container {
      width: 100vw;
      height: 25vh; /* 画面の上部25%（約1/4） */
      background: #f7f3ec;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      border-bottom: 1px solid #e2dcd5;
      overflow: hidden;
    }

    /* 90度回転させて、縦持ちのスマホでも横書きの文字が読めるようにするボックス */
    .rotated-header-content {
      width: 25vh;  /* 回転させるため幅と高さを入れ替え */
      height: 100vw;
      transform: rotate(90deg);
      transform-origin: center center;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
    }

    .text-group { display: flex; flex-direction: column; text-align: left; }
    h2 { color: #d4af37; margin: 0; font-size: 15px; line-height: 1.1; }
    p { margin: 0; font-size: 10px; color: #555; }
    
    .controls { display: flex; align-items: center; gap: 8px; }
    button {
      padding: 8px 20px; font-size: 13px; border-radius: 20px;
      border: none; cursor: pointer; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      white-space: nowrap;
    }
    #recordBtn { background: #e55039; color: white; }
    #stopBtn { background: #2f3542; color: white; display: none; }
    #status { font-size: 10px; font-weight: bold; min-height: 14px; color: #333; }
    #resultLink { color: #007bff; text-decoration: underline; font-size: 10px; display: block; }


    /* 【下部 3/4エリア】カメラ映像エリア：回転一切なしのノーマルエリア */
    .camera-section {
      width: 100vw;
      height: 75vh; /* 画面の下部75%（約3/4） */
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      position: relative;
      overflow: hidden;
    }

    /* 完全に比率（16:9 や 3:4）を保つ横長ビデオコンテナ */
    .video-container {
      width: 94vw;
      aspect-ratio: 16 / 9; /* ご希望の16:9横長（3:4等に変えたい場合は aspect-ratio: 4 / 3; などに変更可） */
      max-height: 95%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      position: relative;
    }
    
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; /* 黒帯なしで綺麗に埋める */
      transform: scaleX(-1); /* フロントカメラの左右反転のみ */
    }

    #timerBadge {
      position: absolute; top: 10px; right: 10px;
      background: rgba(255, 71, 87, 0.85); color: white;
      padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 12px;
      display: none; z-index: 10;
    }
    
    .recording-mode .hide-during-rec { display: none !important; }
  </style>
</head>
<body>
  
  <!-- 上部1/4：テキストとボタン（90度回転して横向きで見やすく配置） -->
  <div class="rotated-header-container" id="headerContainer">
    <div class="rotated-header-content">
      <div class="text-group hide-during-rec">
        <h2>Happy Wedding!</h2>
        <p>📱 スマホを横向きにして大勢で撮影しよう</p>
      </div>
      
      <div class="controls">
        <button id="recordBtn">録画開始</button>
        <button id="stopBtn">録画ストップ</button>
      </div>
      
      <div class="hide-during-rec" style="text-align: right;">
        <div id="status"></div>
        <a id="resultLink" href="" target="_blank" style="display: none;">🎥 動画を確認</a>
      </div>
    </div>
  </div>
  
  <!-- 下部3/4：カメラ撮影エリア（回転なしのノーマルエリア・16:9横長） -->
  <div class="camera-section">
    <div class="video-container" id="videoContainer">
      <div id="timerBadge">残り 20秒</div>
      <video id="preview" autoplay muted playsinline></video>
      <canvas id="recordCanvas" style="display:none;"></canvas>
    </div>
  </div>

  <script>
    const cloudName = 'wf1qutrj'; const uploadPreset = 'jr3hrfi9';
    let mediaRecorder, recordedChunks = [], cameraStream, animFrameId, timer, countdownInterval;
    const maxTime = 20, preview = document.getElementById('preview'), canvas = document.getElementById('recordCanvas'), ctx = canvas.getContext('2d');
    const recordBtn = document.getElementById('recordBtn'), stopBtn = document.getElementById('stopBtn'), status = document.getElementById('status'), timerBadge = document.getElementById('timerBadge'), resultLink = document.getElementById('resultLink'), videoContainer = document.getElementById('videoContainer'), headerContainer = document.getElementById('headerContainer');

    async function initCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, 
          audio: true 
        });
        preview.srcObject = cameraStream;
      } catch (e) {
        try { 
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true }); 
          preview.srcObject = cameraStream; 
        } catch (err) { 
          status.innerText = 'カメラ許可必要🙏'; 
        }
      }
    }
    initCamera();

    function drawFrame() {
      if (preview.readyState >= preview.HAVE_CURRENT_DATA) {
        let vW = preview.videoWidth, vH = preview.videoHeight;
        if (vW > 0 && vH > 0) {
          let targetW = 1280;
          let targetH = 720; // 16:9の横長解像度で綺麗に録画データを生成
          if (canvas.width !== targetW || canvas.height !== targetH) {
            canvas.width = targetW;
            canvas.height = targetH;
          }
          ctx.clearRect(0, 0, targetW, targetH);
          ctx.save();
          ctx.translate(targetW, 0);
          ctx.scale(-1, 1); // 左右反転
          
          let sRatio = vW / vH;
          let tRatio = targetW / targetH;
          let sW, sH, sX, sY;
          if (sRatio > tRatio) {
            sH = vH; sW = vH * tRatio;
            sX = (vW - sW) / 2; sY = 0;
          } else {
            sW = vW; sH = vW / tRatio;
            sX = 0; sY = (vH - sH) / 2;
          }
          ctx.drawImage(preview, sX, sY, sW, sH, 0, 0, targetW, targetH);
          ctx.restore();
        }
      }
      animFrameId = requestAnimationFrame(drawFrame);
    }

    recordBtn.addEventListener('click', () => {
      recordedChunks = []; resultLink.style.display = 'none';
      headerContainer.classList.add('recording-mode');
      drawFrame();
      const canvasStream = canvas.captureStream(30);
      if (cameraStream.getAudioTracks().length > 0) canvasStream.addTrack(cameraStream.getAudioTracks()[0]);
      
      try { mediaRecorder = new MediaRecorder(canvasStream, { videoBitsPerSecond: 2000000 }); } 
      catch (e) { mediaRecorder = new MediaRecorder(canvasStream); }

      mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        cancelAnimationFrame(animFrameId); clearInterval(countdownInterval); clearTimeout(timer); timerBadge.style.display = 'none';
        headerContainer.classList.remove('recording-mode');
        status.innerText = '送信中... ⏳'; recordBtn.style.display = 'none'; stopBtn.style.display = 'none';
        
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
        const formData = new FormData(); formData.append('file', blob); formData.append('upload_preset', uploadPreset);
        try {
          const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, { method: 'POST', body: formData });
          const json = await res.json();
          if (res.ok && json.secure_url) {
            status.innerText = '送信完了！🎉'; status.style.color = '#2ed573';
            resultLink.href = json.secure_url; resultLink.style.display = 'inline';
          } else { throw new Error(json.error?.message || 'エラー'); }
        } catch (err) {
          status.innerText = `エラー: ${err.message}`; status.style.color = 'red'; recordBtn.style.display = 'inline-block';
        }
      };

      mediaRecorder.start(250);
      recordBtn.style.display = 'none'; stopBtn.style.display = 'inline-block';
      let timeLeft = maxTime; timerBadge.innerText = `残り ${timeLeft}秒`; timerBadge.style.display = 'block';
      countdownInterval = setInterval(() => { if (--timeLeft >= 0) timerBadge.innerText = `残り ${timeLeft}秒`; }, 1000);
      timer = setTimeout(() => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); }, maxTime * 1000);
    });

    stopBtn.addEventListener('click', () => { if (mediaRecorder.state === 'recording') mediaRecorder.stop(); });
  </script>
</body>
</html>
